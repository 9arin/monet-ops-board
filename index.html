<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>MONET 100 운영 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 운영 현장의 종이 도면 + 화이트보드 마커: 도면이 주인공, 범례 색은 화이트보드 펜 색 그대로 */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1f2b29; --muted:#5f6b69; --line:#d9dedc; --soft:#e9ecea;
  --accent:#b85440; --accent-ink:#ffffff; --brand:#2c3a38;
  --ok:#2f7d4f; --warn:#b7791f; --bad:#c0392b; --okbg:#e3f1e8; --warnbg:#fbf0dc; --badbg:#f9e3e0;
  --t-staff:#2e9a52; --t-stanchion:#d93a2f; --t-pop:#e2b007; --t-desk:#ef8a1f; --t-chair:#222222;
  --t-exhibit:#c2287a; --t-sticker:#2f6fdb; --t-caution:#14968c; --t-note:#7a8583;
  --v1:#7a5af5; --v2:#b58900; --v3:#3f9a3a; --v4:#14968c; --v5:#9a6b2f; --v6:#2f6fdb; --v7:#c2287a; --vbg:.16;
  --plan-filter:none; --scrim:rgba(20,26,25,.88); --scrim-ink:#ffffff; --shadow:rgba(20,30,28,.18);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a19; --panel:#1c2423; --ink:#e7ecea; --muted:#9aa6a3; --line:#2f3a38; --soft:#242e2c;
  --accent:#e07a62; --accent-ink:#1a0f0b; --brand:#cfe0db;
  --ok:#6cc48d; --warn:#e3b55a; --bad:#ef7a6c; --okbg:#1d3326; --warnbg:#3a2f18; --badbg:#3d1f1b;
  --t-staff:#4fc77a; --t-stanchion:#ff6b5e; --t-pop:#f4cf3a; --t-desk:#ffa24a; --t-chair:#e7ecea;
  --t-exhibit:#f05aa8; --t-sticker:#6ea0ff; --t-caution:#3cc7bb; --t-note:#9aa6a3;
  --v1:#a48cff; --v2:#e8c14a; --v3:#6cc46a; --v4:#3cc7bb; --v5:#d19a5c; --v6:#6ea0ff; --v7:#f05aa8; --vbg:.22;
  --plan-filter:invert(.9) hue-rotate(180deg); --shadow:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --panel:#1c2423; --ink:#e7ecea; --muted:#9aa6a3; --line:#2f3a38; --soft:#242e2c;
  --accent:#e07a62; --accent-ink:#1a0f0b; --brand:#cfe0db;
  --ok:#6cc48d; --warn:#e3b55a; --bad:#ef7a6c; --okbg:#1d3326; --warnbg:#3a2f18; --badbg:#3d1f1b;
  --t-staff:#4fc77a; --t-stanchion:#ff6b5e; --t-pop:#f4cf3a; --t-desk:#ffa24a; --t-chair:#e7ecea;
  --t-exhibit:#f05aa8; --t-sticker:#6ea0ff; --t-caution:#3cc7bb; --t-note:#9aa6a3;
  --v1:#a48cff; --v2:#e8c14a; --v3:#6cc46a; --v4:#3cc7bb; --v5:#d19a5c; --v6:#6ea0ff; --v7:#f05aa8; --vbg:.22;
  --plan-filter:invert(.9) hue-rotate(180deg); --shadow:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{margin:2px 0 0;font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:120px}
.stat b{display:block;font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.notice{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--warnbg);color:var(--ink)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .cnt{font-family:var(--f-num);font-size:11px;margin-left:6px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 14px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--panel)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--panel);cursor:pointer;font-size:13px}
.chip[data-vis][aria-pressed="false"]{opacity:.45}
.chip.add[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.muted{color:var(--muted)}
.small{font-size:12px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* plan */
.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:900px){.plan-grid{grid-template-columns:minmax(0,1fr)}}
.plan-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.plan{position:relative;min-width:680px;aspect-ratio:1600/1075;max-width:100%;touch-action:none;user-select:none}
.plan img{position:absolute;inset:0;width:100%;height:100%;filter:var(--plan-filter);pointer-events:none}
:root[data-theme="dark"] .plan-scroll{background:#141a19}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .plan-scroll{background:#141a19}}
.plan.adding{cursor:crosshair}
.mk{position:absolute;transform:translate(-50%,-50%);min-width:24px;height:24px;padding:0 5px;border-radius:12px;border:2px solid #fff;
  color:#fff;font:600 11px/20px var(--f-num);text-align:center;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.35);white-space:nowrap}
.plan.locked .mk{cursor:pointer}
.mk.sel{outline:3px solid var(--ink);outline-offset:1px;z-index:5}
.mk.dragging{cursor:grabbing;z-index:6}
.mk.dark-text{color:#1f2b29}
.mk .lbl{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:4px;padding:0 4px;font:500 10.5px/16px var(--f-ui);pointer-events:none}
.plan.nolabels .mk .lbl{display:none}
.mk:hover .lbl{display:block!important;z-index:7}
.side{display:flex;flex-direction:column;gap:12px}
.side h3,.panel h3{margin:0 0 8px;font-size:15px}
.legend{display:flex;flex-direction:column;gap:6px}
.legend .li{display:flex;align-items:center;gap:8px;justify-content:space-between}
.legend .li>span{display:flex;align-items:center;gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);font-size:14px}
textarea{resize:vertical;min-height:60px}
/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--soft)}
td input,td select{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;width:100%;min-width:60px}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{border-color:var(--accent);background:var(--bg)}
td.r,th.r{text-align:right}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.s-need{background:var(--badbg);color:var(--bad)}
.s-mid{background:var(--warnbg);color:var(--warn)}
.s-done{background:var(--okbg);color:var(--ok)}
.days{display:flex;gap:2px}
.days button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:11px;cursor:pointer;padding:0}
.days button[aria-pressed="true"]{background:var(--soft);color:var(--muted);text-decoration:line-through}
.cov td{text-align:center;font-size:12px;white-space:nowrap}
.cov td.slot{text-align:left;font-weight:600}
.c-main{background:transparent}
.c-cover{background:var(--warnbg)}
.c-merge{background:var(--warnbg);color:var(--warn)}
.c-gap{background:var(--badbg);color:var(--bad);font-weight:700}
.c-extra{background:var(--okbg);color:var(--ok)}
.task{display:grid;grid-template-columns:24px 52px minmax(0,1fr) 140px 110px 32px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.task.sel{background:var(--warnbg)}
.pinbtn{border:1px dashed var(--line);background:none;border-radius:999px;font:600 11px/20px var(--f-num);color:var(--muted);cursor:pointer;padding:0 6px;white-space:nowrap}
.pinbtn.has{border-style:solid;border-color:var(--accent);color:var(--accent)}
.pinbtn.placing{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mapcard{margin-bottom:16px}
.mapcard .plan-scroll{max-width:1040px}
.mapcard.closed .plan-scroll,.mapcard.closed .maphint{display:none}
.mk.static{cursor:pointer}
.mk.faded{opacity:.22}
.mk.gap{box-shadow:0 0 0 3px var(--bad)}
.daypick button{min-width:34px}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:2px;padding:0}
.task.done .t-title{color:var(--muted);text-decoration:line-through}
.task input[type=text],.task input[type=date]{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;width:100%}
.task input:hover{border-color:var(--line)}
.task.overdue .t-due{color:var(--bad);font-weight:600}
@media (max-width:640px){.task{grid-template-columns:24px minmax(0,1fr) 32px}.task .pinbtn{grid-column:2;justify-self:start}.task .t-title{grid-column:2}.task .t-due,.task .t-owner{grid-column:2}}
.group-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 4px}
.group-h h4{margin:0;font-size:14px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.x:hover{color:var(--bad)}
.addform{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end;margin-top:12px}
.addform.three{grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto}
.addform.six{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.2fr) minmax(0,2fr) auto}
@media (max-width:720px){.addform,.addform.three,.addform.six{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.toastbtn{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0 0 0 6px}
.thsort{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.thsort:hover{color:var(--ink)}
th.r .thsort{width:100%;text-align:right}
.thsort .arr{margin-left:3px;color:var(--brand)}
.sortbar{gap:8px;align-items:center;margin-bottom:10px}
.sortbar .seg{flex-wrap:wrap}
.sortsel{display:inline-flex;align-items:center;gap:6px;margin:0 0 8px}
.sortsel select{width:auto}
/* 3D 보기 */
.t3-host{padding:0;overflow:hidden}
.t3-host>p{padding:16px}
.t3-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.t3-ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.t3-tools .btn[aria-pressed="true"]{background:var(--brand);color:var(--panel);border-color:var(--brand)}
.t3-stage{position:relative;height:min(74vh,760px);min-height:420px;background:var(--soft)}
.t3-stage canvas{display:block;width:100%;height:100%;touch-action:none}
.t3-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.t3-tag{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:11.5px;font-weight:600;padding:3px 7px;border-radius:6px;background:var(--t-staff);color:var(--panel);box-shadow:0 1px 3px var(--shadow)}
.t3-tag.k-cover{background:var(--warn)} .t3-tag.k-empty{background:var(--bad)} .t3-tag.k-none{background:var(--muted)}
.t3-tag small{font-weight:500;opacity:.9;margin-left:4px}
.t3-float{position:absolute;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px var(--shadow)}
.t3-legend{left:10px;top:10px;padding:8px 10px;width:200px;max-height:calc(100% - 20px);overflow:auto}
.t3-legend summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);padding:2px 0 6px}
.t3-lg{display:grid;gap:2px}
.t3-lg button{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:8px;font:inherit;font-size:13px;text-align:left;padding:5px 6px;border:0;border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
.t3-lg button:hover{background:var(--soft)} .t3-lg button[aria-pressed="false"]{opacity:.4}
.t3-lg em{font-style:normal;color:var(--muted);font-size:12px;font-family:var(--f-num)}
.t3-sw{width:14px;height:14px;border-radius:4px}
.t3-card{right:10px;top:10px;width:290px;max-height:calc(100% - 20px);overflow:auto;padding:12px 14px}
.t3-card .x{position:absolute;right:8px;top:6px;font-size:18px}
.t3-title{font-size:16px;font-weight:700;margin:0 24px 2px 0}
.t3-kv{display:grid;grid-template-columns:70px 1fr;gap:4px 10px;font-size:13px;margin:10px 0}
.t3-kv dt{color:var(--muted)} .t3-kv dd{margin:0}
.t3-week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:4px 0 10px}
.t3-week div{text-align:center;font-size:11px;padding:4px 0;border-radius:5px;background:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t3-week div b{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.t3-week div.today{outline:2px solid var(--brand)} .t3-week div.cov{color:var(--warn);font-weight:700} .t3-week div.gap{color:var(--bad)}
.t3-exitwalk{position:absolute;z-index:5;right:10px;top:10px}
.t3-tour{left:50%;transform:translateX(-50%);bottom:10px;width:min(600px,calc(100% - 20px));max-height:60%;overflow:auto;padding:12px 14px;display:grid;gap:6px}
.t3-tprog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-family:var(--f-num)}
.t3-tbar{flex:1;height:4px;border-radius:4px;background:var(--soft);overflow:hidden}
.t3-tbar i{display:block;height:100%;background:var(--brand);transition:width .4s}
.t3-tzone{font-size:12px;color:var(--muted);font-weight:600}
.t3-ttitle{font-size:18px;font-weight:700;line-height:1.3}
.t3-tdesc{margin:0;font-size:13.5px;line-height:1.6}
.t3-tstaff{display:grid;gap:4px;padding:8px 10px;border-radius:8px;background:var(--soft)}
.t3-tlab{font-size:11.5px;color:var(--muted)}
.t3-trow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px}
.t3-trow em{font-style:normal;color:var(--muted);font-size:12px;margin-left:auto;font-family:var(--f-num)}
.t3-tdot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;background:var(--t-staff)} .t3-tdot.k-cover{background:var(--warn)} .t3-tdot.k-empty{background:var(--bad)} .t3-tdot.k-none{background:var(--muted)}
.t3-tour blockquote{margin:0;padding:6px 10px;border-left:3px solid var(--brand);font-size:14px;line-height:1.55;font-weight:500}
.t3-tour blockquote::before{content:"스태프 안내 멘트";display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:2px}
.t3-tctl{display:flex;flex-wrap:wrap;gap:6px}
.t3-tctl .btn:disabled{opacity:.4;cursor:default}
.t3-tctl .btn[aria-pressed="true"]{border-color:var(--brand);font-weight:600}
.t3-tctl .t3-end{margin-left:auto}
.t3-fade{position:absolute;inset:0;z-index:6;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .4s}
.t3-fade.on{opacity:1}
.t3-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
@media (max-width:640px){
  .t3-stage{height:70vh}
  .t3-legend{width:auto;left:8px;right:auto;top:8px}
  .t3-card{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:55%}
  .t3-hint{display:none}
  .t3-tour{left:6px;right:6px;width:auto;transform:none;bottom:6px;max-height:55%;padding:10px}
  .t3-ttitle{font-size:16px} .t3-tdesc{font-size:13px}
}
.ver4seg{margin-left:6px}
/* 물품 표: 옆으로 밀지 않아도 보이게 칸을 줄이고, 후보·삭제는 오른쪽에 고정 */
table.itbl td,table.itbl th{padding:5px 5px}
table.itbl .ck{width:26px;padding:5px 2px 5px 6px}
table.itbl .ck input{width:auto;margin:0}
table.itbl td select,table.itbl td input:not([type=checkbox]){padding-left:6px;padding-right:6px}
table.itbl .acts{position:sticky;right:0;z-index:1;background:var(--panel);white-space:nowrap;box-shadow:-8px 0 8px -8px var(--shadow)}
table.itbl thead .acts{background:var(--soft)}
table.itbl tr.rowsel .acts{background:inherit}
.vtog button{padding:3px 5px}
.verbar{gap:8px;align-items:center;margin-bottom:10px}
.vtog{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.vtog button{font:inherit;font-size:11.5px;padding:3px 6px;border:0;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.vtog button+button{border-left:1px solid var(--line)}
.vtog button[aria-pressed="true"]{background:var(--brand);color:var(--panel);font-weight:600}
.vernote{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:12px;padding:10px 12px;border-left:4px solid var(--accent)}
.selbar{gap:10px;align-items:center;margin-bottom:8px;padding:6px 10px;border-radius:8px;background:var(--soft)}
.shopr{position:relative}
.shopx{position:absolute;top:4px;right:4px;background:var(--panel);border-radius:50%;width:22px;height:22px;z-index:1}
.idelrow{justify-content:flex-end;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:50}
@media (prefers-reduced-motion:no-preference){.mk{transition:box-shadow .15s}}
.auth{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:12px}
.auth h2{margin:0;font-size:18px}
.auth p{margin:0;color:var(--muted)}
.auth form{display:flex;gap:8px;flex-wrap:wrap}
.auth input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
/* 끌어다 놓기 · 견적서 · 후보 */
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--warnbg);color:var(--ink)}
tr.cand-row .drop{cursor:default;padding:10px}
.cand-in{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.qcard{border:1px solid var(--line);border-top:4px solid var(--qc);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--panel);min-width:0}
.qname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.qrow input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg);min-width:0;width:100%;font-size:13px}
.btn.small{padding:3px 8px;font-size:12px;white-space:nowrap}
.qsel{box-shadow:inset 4px 0 0 var(--qc)}
.thumbcell{width:56px}
.drop.thumb{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;border-radius:8px}
.drop.thumb img{width:100%;height:100%;object-fit:cover}
tr.cand-row>td{background:var(--soft);padding:10px}
tr.cand-row>td>*{position:sticky;left:10px;max-width:min(960px,calc(100vw - 96px))}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px;text-align:left}
.cand{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--panel);min-width:0}
.cand.chosen{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cand img,.cand .noimg{width:100%;aspect-ratio:1;object-fit:contain;background:var(--soft);border-radius:6px;display:flex;align-items:center;justify-content:center}
.candadd{flex-wrap:nowrap}
.candadd [data-cin]{flex:2;min-width:0}
.candadd [data-cnote]{flex:1;min-width:0}
@media (max-width:640px){.candadd{flex-wrap:wrap}.candadd [data-cin],.candadd [data-cnote]{flex:1 1 100%}}
.shop{margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.shopform{flex-wrap:nowrap}
.shopform [data-sq]{flex:1;min-width:0}
.shopstat{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.shopstat b{font-size:15px}
.shopbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.shopr .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
.shopr .pr{font-size:15px}
.src{border:1px solid var(--line);color:var(--muted)}
@media (max-width:640px){.shopform{flex-wrap:wrap}.shopform [data-sq]{flex:1 1 100%}}
.drop.cimg{padding:0;border-width:1px;position:relative;overflow:hidden}
.drop.cimg img{display:block}
.cimg-hint{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);font-size:11px;text-align:center;opacity:0;transition:opacity .15s}
.drop.cimg:hover .cimg-hint{opacity:.85}
.cand .t{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.slotedit td input{min-width:90px}
.kindseg{flex-wrap:wrap}
table.rota{border-collapse:collapse;min-width:640px}
table.rota th,table.rota td{border:1px solid var(--line);padding:5px 4px;text-align:center;font-size:12.5px;vertical-align:middle}
table.rota th{background:var(--soft);color:var(--ink);font-size:13px}
table.rota th.we{color:var(--accent)}
table.rota .rl{text-align:left;font-weight:600;white-space:nowrap;min-width:120px;background:var(--panel)}
table.rota tr.sec th{text-align:left;background:var(--brand);color:var(--panel);font-size:12.5px;padding:4px 8px}
table.rota tr.sec th .small{opacity:.8;font-weight:400}
table.rota tr.sec select{font-size:12px;padding:0 2px;border-radius:4px;border:0}
table.rota .brk{display:block;font-weight:400;font-size:11px;color:var(--muted)}
table.rota td.cov{background:var(--warnbg)}
table.rota td.gap{background:var(--badbg);color:var(--bad);font-weight:700}
table.rota td.nt{background:var(--okbg);line-height:1.5}
table.rota tr.offrow td{color:var(--muted);line-height:1.5;vertical-align:top}
table.rota tr.sum td.ok{color:var(--ok);font-weight:600}
table.rota tr.sum td.bad{color:var(--bad);font-weight:600}
.printonly{display:none}
.pdfpick{position:absolute;z-index:60;width:240px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.pdfpick label{padding:3px 0;cursor:pointer}
@media print{.pdfpick{display:none!important}}
.uchip{cursor:default;margin:2px}
table.rota .poslbl{all:unset;cursor:pointer;font-weight:600;border-bottom:1px dashed var(--line)}
table.rota .poslbl:hover{color:var(--accent)}
table.rota .posname{width:100%;min-width:110px;font:inherit;font-weight:600;border:1px solid var(--accent);border-radius:4px;padding:2px 4px;background:var(--bg)}
table.rota .mslbl{display:inline-block;margin-top:2px;padding:0 4px;border-radius:4px;background:var(--warnbg);color:var(--warn);font-size:10.5px;font-weight:600}
.nadd option.dim{color:var(--muted)}
.mchip{padding:1px 2px 1px 8px;font-size:12px;cursor:default}
tr.mustrow>td{background:var(--soft)}
table.rota th.today{box-shadow:inset 0 -3px 0 var(--accent)}
table.rota td.closed{color:var(--muted);background:var(--soft);font-size:11px}
table.rota td.swp{background:var(--okbg)}
table.rota td.over{box-shadow:inset 0 0 0 2px var(--bad)}
table.rota .overtxt{color:var(--bad);font-weight:700}
table.rota .cellbtn{all:unset;cursor:pointer;display:block;width:100%;min-height:18px}
table.rota .cellbtn:hover{text-decoration:underline}
table.rota td.editing select{width:100%;font-size:12px;border:1px solid var(--accent);border-radius:4px;background:var(--bg)}
.nightgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.nightgrid{grid-template-columns:minmax(0,1fr)}}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.calh{text-align:center;font-size:11px;color:var(--muted)}
.calh.we,.cal.we{color:var(--accent)}
.cal{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:12px;cursor:pointer;padding:0}
.cal:disabled{opacity:.3;cursor:default}
.cal.on{background:var(--brand);color:var(--panel);border-color:var(--brand);font-weight:700}
.cal.short{box-shadow:inset 0 0 0 2px var(--bad)}
@media print{.printonly{display:inline}}
table.week td{vertical-align:middle}
.wkname{min-width:120px}
.wkname input{display:block;margin-bottom:2px}
.trange{min-width:170px}
.rr{display:grid;grid-template-columns:28px 44px minmax(80px,1fr);gap:4px;align-items:center;font-size:11px;color:var(--muted)}
.rr b{color:var(--ink);font-weight:600;font-size:12px;white-space:nowrap}
.rr.wide{grid-template-columns:28px 84px minmax(80px,1fr)}
.trange:has(.rr.wide){min-width:210px}
.rr input[type=range]{width:100%;accent-color:var(--accent)}
.trange select{border:1px solid var(--line);border-radius:6px;padding:2px 4px;background:var(--bg);font-size:12px;margin-top:2px}

.man-img{border:1px dashed var(--line);border-radius:10px;padding:10px;color:var(--muted);font-size:13px;margin:8px 0}
.man-sec.hide{display:none}
@media print{.man-tools,.man-toc,.man-head .row{display:none}}

<script>
const PLAN = {"4F":"img/4F.jpg","3F":"img/3F.jpg"};
const TYPES = {

const DAYS = ["월","화","수","목","금","토","일"];
const GROUPS = [
  {id:"rec",name:"리셉션",floor:"4층",slots:[

  {id:"f4",name:"4층 전시·미디어",floor:"4층",slots:[
    {id:"s2",name:"② 살롱~산업혁명",time:"11:00~20:00",brk:"12:00~13:00",cover:"③ 함께 봄",merge:"s3"},

    {id:"s8b",name:"⑧ 굿즈샵 2",time:"11:00~20:00",brk:"미정",cover:"⑧ 굿즈샵",merge:"s8",optional:true}]},
  {id:"f3",name:"3층 순회",floor:"3층",slots:[

    {id:"s6b",name:"⑥ 오후조",time:"11:30~20:30",brk:"17:30~18:30",cover:"⑥ 오전조"}]}
];
const SLOT = {}; GROUPS.forEach(g=>g.slots.forEach(s=>SLOT[s.id]={...s,group:g.id}));
const SLOT_ORIG = {}; GROUPS.forEach(g=>g.slots.forEach(s=>SLOT_ORIG[s.id]={...s}));
function applySlotCfg(){ // 인력 탭에서 바꾼 자리 이름·시간 (DB staff/cfg-slots)
  const c=(state.settings.find(x=>x.id==="cfg-slots")||{}).slots||{};
  GROUPS.forEach(g=>g.slots.forEach(s=>{ const o=c[s.id]||{}; Object.assign(s,SLOT_ORIG[s.id]);
    ["name","time","brk"].forEach(k=>{ if(o[k]) s[k]=o[k]; }); SLOT[s.id]={...s,group:g.id}; }));
}
const ITEM_KIND = ["구매","대여","제작","협조 요청","보유"];
const OWNED="보유"; // 이미 가진 물품: 견적·단가 없음
const ITEM_STATUS = ["필요","견적","주문","입고","준비 완료","설치 완료","반납 완료"];
const ITEM_DONE = ["입고","준비 완료","설치 완료","반납 완료"]; // 손 안 써도 되는 상태
const PRE_STATUS = ["","필요","견적","주문"]; // 보유로 바꾸면 이 상태는 "준비 완료"로
const STAFF_STATUS = ["모집 중","면접","확정"];
const TASK_CATS = ["확정 필요","채용·계약","물품","교육","현장 세팅","행정"];
const COLS = ["markers","items","staff","tasks"];

// DB 컬렉션은 4개 그대로 두고, id 앞글자로 나눠 담아요 (SQL 변경 없이): 견적서 q-, 파일 f- → items / 설정 cfg- → staff
const VCOL = {quotes:{col:"items",pre:"q-"},files:{col:"items",pre:"f-"},settings:{col:"staff",pre:"cfg-"},graphics:{col:"markers",pre:"g-"},nights:{col:"tasks",pre:"n-"},sched:{col:"tasks",pre:"s-"},docs:{col:"items",pre:"d-"},manual:{col:"tasks",pre:"o-"}};
const ALLC = COLS.concat(Object.keys(VCOL));
const vcolOf=(col,id)=>{for(const [k,v] of Object.entries(VCOL)) if(v.col===col&&String(id).startsWith(v.pre)) return k; return col;};
const dbCol=c=>VCOL[c]?VCOL[c].col:c;
const state = {markers:[],items:[],staff:[],tasks:[],quotes:[],files:[],settings:[],graphics:[],nights:[],sched:[],docs:[],manual:[]};
const loaded = {markers:false,items:false,staff:false,tasks:false,quotes:false,files:false,settings:false,graphics:false,nights:false,sched:false,docs:false,manual:false};
const ui = {tab:"plan",floor:"4F",hidden:new Set(),addType:null,sel:null,labels:true,taskFilter:"open",confirmDel:null,
  mapOpen:true,staffDay:(new Date().getDay()+6)%7,itemFocus:null,placingTask:null,taskSel:null,quoteFilter:null,openItem:null,slotEdit:false,planEdit:false,unlockKey:null,gSel:null,gAdd:null,gStart:null,kindFilter:null,hiPos:null,hiItem:null,rotaWeek:null,editCell:null,mustOpen:null,mustMon:null,editPos:null};
try{const t=localStorage.getItem("mb-tab"); if(t) ui.tab=t; const f=localStorage.getItem("mb-floor"); if(f) ui.floor=f; if(localStorage.getItem("mb-map")==="0") ui.mapOpen=false;}catch(e){}
let db=null, mode="loading";

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won=n=>n?Number(n).toLocaleString("ko-KR"):"";
const uid=p=>p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tcolor=t=>`var(${(TYPES[t]||TYPES.note).c})`;
function toast(msg){if(undoToast._done) undoToast._done(); const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200);}
const pending={}, inflight={};
const unsaved={}, unremoved={}; // 서버에 아직 안 들어간 저장·삭제 (10초 새로고침이 덮어쓰지 않게)
const typing=()=>{const a=document.activeElement; return !!a&&$("#view").contains(a)&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&!/^(checkbox|radio|file|button|submit)$/.test(a.type)));};
const busy=()=>Object.keys(unsaved).length+Object.keys(unremoved).length>0;
async function save(col,obj,quiet){ // quiet: 입력 중이면 화면 새로 그리기를 미룸 (자동 입력 결과 등)
  const i=state[col].findIndex(x=>x.id===obj.id);
  if(i>=0) state[col][i]=obj; else state[col].push(obj);
  (quiet||typing())?scheduleRender():render(); // 글자 치는 중엔 화면을 다시 그리지 않아요 (커서 유지)
  if(!db||(guest&&col!=="graphics")) return; /* 손님은 그래픽 내용만 저장돼요 */
  const key=col+"/"+obj.id; const {id,...data}=obj;
  unsaved[key]={col,obj}; pending[key]=data; if(inflight[key]) return;
  inflight[key]=true;
  while(pending[key]){const d=pending[key]; delete pending[key];
    const {error}=await db.from(TABLE).upsert({col:dbCol(col),id,data:d,updated_at:new Date().toISOString()});
    if(error){handleErr(error);break;}}
  inflight[key]=false; delete unsaved[key];
}
async function remove(col,id){
  state[col]=state[col].filter(x=>x.id!==id); render();
  if(db&&!guest){ const key=col+"/"+id; unremoved[key]={col,id}; delete unsaved[key];
    const {error}=await db.from(TABLE).delete().eq("col",dbCol(col)).eq("id",id); delete unremoved[key]; if(error) handleErr(error);
    if(col==="files") db.from(TABLE).delete().eq("col","items").like("id",id+"~%").then(()=>{}); } // 조각도 같이 지움
}
// 글자를 치면 잠깐 뒤 자동 저장 (칸을 벗어나지 않고 새로고침해도 안 사라지게)
let typeTimer=null;
document.addEventListener("input",e=>{ const el=e.target; if(!$("#view").contains(el)||typeof el.onchange!=="function"||!/^(INPUT|TEXTAREA)$/.test(el.tagName)||/^(checkbox|radio|file)$/.test(el.type)) return;
  clearTimeout(typeTimer); typeTimer=setTimeout(()=>{ if(document.contains(el)) el.onchange({target:el}); },700); });
// 저장이 끝나기 전에 닫거나 새로고침하면 한 번 물어봐요
window.addEventListener("beforeunload",e=>{ const a=document.activeElement;
  if(typeTimer&&a&&typeof a.onchange==="function"){ clearTimeout(typeTimer); typeTimer=null; a.onchange({target:a}); }
  if(busy()){ e.preventDefault(); e.returnValue=""; } });
function handleErr(e){
  console.error(e);
  if(e&&(e.code==="42501"||/row-level security/i.test(e.message||""))){setNotice("권한이 없어서 저장하지 못했어요. 팀 비밀번호가 바뀌었을 수 있어요. 로그아웃 후 다시 들어와 주세요.");}
  else toast("저장하지 못했어요. 잠시 후 다시 시도해 주세요.");
}
function setNotice(t){const n=$("#notice");n.textContent=t||"";n.hidden=!t;}

/* ---------- boot (Supabase) ---------- */
const TABLE="board_docs";
const cfg=window.BOARD_CONFIG||{};
let channel=null;
function showLogin(on){ $("#login").hidden=!on; $("#tabs").hidden=on; $("#view").hidden=on; $("#stats").hidden=on; }
function applyRow(row){ if(!row||!COLS.includes(row.col)||String(row.id).includes("~")) return; const c=vcolOf(row.col,row.id); // ~ = 파일 조각
  const o=c==="files"?{id:row.id,...((row.data||{}).meta||{})}:{id:row.id,...row.data}; // 파일 본문(b64)은 필요할 때만 받아요
  const i=state[c].findIndex(x=>x.id===row.id); if(i>=0) state[c][i]=o; else state[c].push(o); }
async function loadAll(){
  const [r1,r2]=await Promise.all([
    db.from(TABLE).select("col,id,data").not("id","like","f-%").limit(5000),
    db.from(TABLE).select("col,id,meta:data->meta").eq("col","items").like("id","f-%").not("id","like","%~%").limit(2000)]);
  if(r2.error) console.error(r2.error); // 파일 목록이 안 와도 보드는 열리게
  const error=r1.error;
  if(error){ setNotice("데이터를 불러오지 못했어요. 새로고침해 주세요."); console.error(error); return; }
  ALLC.forEach(c=>{state[c]=[];loaded[c]=true;});
  r1.data.forEach(applyRow); (r2.data||[]).forEach(r=>applyRow({col:r.col,id:r.id,data:{meta:r.meta}}));
  Object.values(unsaved).forEach(({col,obj})=>{ const i=state[col].findIndex(x=>x.id===obj.id); if(i>=0) state[col][i]=obj; else state[col].push(obj); }); // 방금 고친 건 내 것으로
  Object.values(unremoved).forEach(({col,id})=>{ state[col]=state[col].filter(x=>x.id!==id); });
  if(guest){ setNotice(""); scheduleRender(); return; } /* 손님: 그래픽만 받아 오고, 아무것도 고치지 않아요 */
  const {data:ok}=await db.rpc("can_board");
  if(ok===false) setNotice("들어올 권한이 없어요. 팀 비밀번호가 바뀌었을 수 있어요. 로그아웃 후 다시 들어와 주세요.");
  else { setNotice(""); [popOnStickers,syncRoster,seedGraphics,seedSched].forEach(f=>{ try{ f(); }catch(e){ console.error(f.name,e); } }); } // 하나가 실패해도 보드는 열리게
  scheduleRender();
}
// 배치도 자리 수가 바뀌면(처음 포함): 구역마다 고정 + 대체 인원을 채우고, 매일 자리가 다 차도록 휴무(연속 2일)를 짜요.
// 있는 사람의 이름 등은 그대로. 휴무표가 이미 맞으면 건드리지 않아요. 같은 자리 구성에선 한 번만 돌아요.
// 야간: 매주 하루 19:30~22:30, 알바 NIGHT_ALBA명 + 운영매니저. 휴게 없음. 야간도 근무 1일로 쳐요.
const NIGHT_TIME="19:30~22:30";
const NIGHT_W=0.5, NIGHT_MAX=2; // 야간 2번 = 근무 1일, 한 사람 한 주 최대 2번
const MAX_H=40, NIGHT_H=3; // 주 40시간을 넘기지 않아요 (주간은 휴게 1시간 뺀 시간, 야간 3시간)
const netH=t=>{ const [a,b]=String(t||"").split("~").map(x=>toMin(x)); return a!=null&&b!=null?Math.max(0,(b-a-60)/60):8; };
const mustDow=p=>p.mustDow||[], mustDates=p=>p.mustDates||[]; // 필수 휴무: 매주 요일 / 특정 날짜
const personNet=(p,pos)=>{ const x=pos.find(y=>y.id===p.pos); return x?netH(posTime(x)):Math.max(8,...pos.filter(y=>y.group===pgroup(p)).map(y=>netH(posTime(y)))); };
const poolDays=(gid,pos)=>{ const hs=pos.filter(x=>x.group===gid).map(x=>netH(posTime(x))); return Math.max(1,Math.min(WORK_DAYS,Math.floor(MAX_H/Math.max(1,...hs)))); };
const nightCfg=()=>{ const c=state.settings.find(x=>x.id==="cfg-night")||{}; return {alba:4,...c,dates:Array.isArray(c.dates)?c.dates.slice().sort():[]}; };
const dayDays=p=>7-(p.off||[]).length; // 휴무표상 근무 가능한 날

// 날짜별 야간 인원: 그 요일에 주간을 쉬고(필수 휴무 날 제외), 주 40시간·야간 2번을 넘지 않는 사람 중 적게 일하는 사람부터
function nightCrews(){
  const nc=nightCfg(), ppl=alba(), pos=positions(), total={}, crews={}, weeks={};
  actCache=null; const cov=coverage(), dayWork=(p,d)=>pos.some(x=>cov.res[x.id][d].who===p); const baseH={}; ppl.forEach(p=>baseH[p.id]=actDays(p)*personNet(p,pos));
  nc.dates.filter(d=>!isClosed(d)).forEach(d=>(weeks[weekKey(d)]=weeks[weekKey(d)]||[]).push(d));
  Object.values(weeks).forEach(ds=>{ const add={}, todo=ds.slice();
    // 야간을 하면 40시간이 넘는 사람은 그 주 주간 하루를 빼요 (지원 근무가 있는 날에서)

    const after=p=>{ const n=(add[p.id]||0)+1, h=baseH[p.id]+NIGHT_H*n; return h>MAX_H?h-personNet(p,pos):h; };
    const cands=date=>ppl.filter(p=>!dayWork(p,dowOf(date))&&!mustDates(p).includes(date)&&(add[p.id]||0)<NIGHT_MAX&&after(p)<=MAX_H)
      .sort((a,b)=>hrs(a)-hrs(b)||(total[a.id]||0)-(total[b.id]||0)||(a.order||0)-(b.order||0));

    const isMan=d=>Array.isArray(man[d])&&man[d].length; // 비워 둔 날은 자동
    todo.filter(isMan).forEach(date=>{ const c=man[date].map(id=>ppl.find(p=>p.id===id)).filter(Boolean); c.forEach(p=>{ add[p.id]=(add[p.id]||0)+1; total[p.id]=(total[p.id]||0)+1; }); crews[date]=c; });
    todo.filter(isMan).forEach(date=>{ const c=crews[date]; cands(date).filter(p=>!c.includes(p)).slice(0,Math.max(0,+nc.alba-c.length)).forEach(p=>{ c.push(p); add[p.id]=(add[p.id]||0)+1; total[p.id]=(total[p.id]||0)+1; }); }); // 골랐던 사람이 없어졌으면 채워요
    const rest=todo.filter(d=>!isMan(d));
    while(rest.length){ rest.sort((a,b)=>cands(a).length-cands(b).length||a.localeCompare(b)); const date=rest.shift(); // 고를 사람이 적은 날부터
      const c=cands(date).slice(0,+nc.alba); c.forEach(p=>{ add[p.id]=(add[p.id]||0)+1; total[p.id]=(total[p.id]||0)+1; }); crews[date]=c; } });

}
// 층별 인원 계획: 야간 담당 k명은 주간 (D-1)일(야간 들어갈 여유), 나머지는 주간 D일로 꽉 채우고, 남는 날은 한 사람에게.
// 쉬는 날 칸 순서: [D일 근무자들, 남는 날 1명, 야간 담당과 그 사이 D일 근무자] — 야간 담당끼리 같은 요일에 쉬도록 간격을 맞춰요
function poolPlan(P,D,k){
  const rest=7*P-k*(D-1); if(rest<0) return null; const q=Math.floor(rest/D), r=rest-q*D, nOff=8-D, fOff=7-D;
  let f=[0,1,2,3,4,5,6].find(x=>(x*fOff)%7===(7-nOff)%7); if(f==null) f=0;
  const fill=Math.max(0,k-1)*f; if(q<fill) return null;
  const sizes=Array(q-fill).fill(fOff); if(r) sizes.push(7-r);
  for(let i=0;i<k;i++){ sizes.push(nOff); if(i<k-1) for(let j=0;j<f;j++) sizes.push(fOff); }
  return {sizes,m:sizes.length,five:sizes.filter(x=>x===fOff).length};
}
function needTargets(pos){ // 층마다 필요 인원: 모두 주 D일(40시간) 계약 기준. 야간 주에는 야간 담당이 하루씩 빠지니 그만큼 여유를 둬요
  const nc=nightCfg(), need={}, target={}, plan={}, D={}; pos.forEach(x=>need[x.group]=(need[x.group]||0)+1);
  const zones=ALLG.filter(g=>need[g.id]); zones.forEach(g=>{ D[g.id]=poolDays(g.id,pos); target[g.id]=Math.ceil(7*need[g.id]/D[g.id]); });
  const drops=nc.dates.length?+nc.alba:0; // 야간이 있는 주에 빠지는 근무일
  const spare=()=>zones.reduce((s,g)=>s+D[g.id]*target[g.id]-7*need[g.id],0);
  while(zones.length&&spare()<drops){ const g=zones.slice().sort((a,b)=>need[b.id]-need[a.id])[0]; target[g.id]++; }
  zones.forEach(g=>plan[g.id]=Array(target[g.id]).fill(7-D[g.id]));
  return {need,target,plan};
}

const DB_BUDGET=350*1024*1024; // 무료 데이터베이스(500MB) 중 파일에 쓸 몫
const usedBytes=()=>state.files.reduce((s,f)=>s+(f.size||0),0)*1.37; // base64라 실제보다 약 37% 큼

function dropZone(el,{onFiles,onText,accept}){
  if(!el) return;
  el.addEventListener("dragover",e=>{e.preventDefault();el.classList.add("over");});
  el.addEventListener("dragleave",()=>el.classList.remove("over"));
  el.addEventListener("drop",e=>{e.preventDefault();el.classList.remove("over");

    if(fs.length){ if(onFiles) onFiles(fs); return; }
    const t=(e.dataTransfer.getData("text/uri-list")||e.dataTransfer.getData("text/plain")||"").split("\n")[0].trim();
    if(t&&onText) onText(t); });
  if(onFiles) el.addEventListener("click",e=>{ if(e.target.closest("input,button,a")) return;
    const inp=document.createElement("input"); inp.type="file"; inp.multiple=true; if(accept) inp.accept=accept;

const readURL=b=>new Promise((ok,no)=>{const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=no; r.readAsDataURL(b);});
function shrinkImage(file,max,q){ // 사진을 줄여 JPEG로
  return new Promise((ok,no)=>{const img=new Image(); img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src); c.toBlob(b=>b?ok(b):no(new Error("이미지")),"image/jpeg",q);};
    img.onerror=no; img.src=URL.createObjectURL(file);});
}
async function storeFile(file,raw){ // raw: 원본 그대로 (디자인 파일)
  let blob=file;

  if(blob.size>MAX_FILE){ toast(`파일이 너무 커요. ${mb(MAX_FILE)}MB까지 올릴 수 있어요.`); return null; }
  if(usedBytes()+blob.size*1.37>DB_BUDGET){ toast(`저장 공간이 부족해요 (지금 약 ${mb(usedBytes())}MB 사용). 안 쓰는 파일을 지워 주세요.`); return null; }
  const id=uid("f"), meta={name:file.name,type:blob.type||file.type,size:blob.size};
  if(blob.size<=CHUNK){
    const b64=await readURL(blob); state.files.push({id,...meta});
    if(!db){ localFiles[id]=b64; return id; }
    const {error}=await db.from(TABLE).upsert({col:"items",id,data:{meta,b64},updated_at:new Date().toISOString()});
    if(error){ handleErr(error); return null; }
    return id;
  }
  meta.chunks=Math.ceil(blob.size/CHUNK);
  if(!db){ state.files.push({id,...meta}); localFiles[id]=blob; return id; }
  for(let k=0;k<meta.chunks;k++){
    toast(`올리는 중… ${k+1}/${meta.chunks}`);
    const b64=b64e(await blob.slice(k*CHUNK,(k+1)*CHUNK).arrayBuffer());
    const {error}=await db.from(TABLE).upsert({col:"items",id:`${id}~${k}`,data:{b64},updated_at:new Date().toISOString()});
    if(error){ handleErr(error); db.from(TABLE).delete().eq("col","items").like("id",`${id}~%`).then(()=>{}); return null; }
  }
  const {error}=await db.from(TABLE).upsert({col:"items",id,data:{meta},updated_at:new Date().toISOString()});
  if(error){ handleErr(error); return null; }
  state.files.push({id,...meta});

const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", PDFJS_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const TESS="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js";
const scripts={};
const loadScript=src=>scripts[src]||(scripts[src]=new Promise((ok,no)=>{const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>{delete scripts[src];no(new Error(src));}; document.head.appendChild(s);}));

async function extractText(file){
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
    await loadScript(PDFJS); pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; let out="";
    for(let i=1;i<=Math.min(pdf.numPages,4);i++){
      const tc=await (await pdf.getPage(i)).getTextContent(); let lastY=null;
      tc.items.forEach(it=>{const y=it.transform[5]; out+=(lastY!==null&&Math.abs(y-lastY)>4)?"\n":" "; out+=it.str; lastY=y;}); out+="\n"; }
    if(out.replace(/\s/g,"").length>40) return out;
    const pg=await pdf.getPage(1), vp=pg.getViewport({scale:2}), c=document.createElement("canvas"); // 스캔한 PDF
    c.width=vp.width; c.height=vp.height; await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    return ocr(c);
  }
  return ocr(file);
}
const BANKS="KB국민|국민|신한|우리|하나|NH농협|농협|IBK기업|기업|카카오뱅크|카카오|토스뱅크|토스|케이뱅크|SC제일|제일|씨티|대구|부산|경남|광주|전북|제주|수협|새마을|우체국|신협|산업";
function parseQuote(text){
  const L=w=>w.split("").join("\\s*"); // 글자 사이 띄어쓰기 허용 (사진 인식은 띄어 읽기 쉬움)
  const t=String(text).replace(/\r/g,"").replace(/[ \t]+/g," ");
  const lines=t.split("\n").map(s=>s.trim()).filter(Boolean);
  const squash=s=>s.replace(/^((?:[가-힣] )+[가-힣])$/,m=>m.replace(/ /g,"")).trim();
  const r={};
  const biz=t.match(/(?<![\d-])(\d{3})\s*-\s*(\d{2})\s*-\s*(\d{5})(?![\d-])/); if(biz) r.bizno=`${biz[1]}-${biz[2]}-${biz[3]}`;
  const em=t.match(/[\w.+-]+@[\w-]+\.[\w.-]+/); if(em) r.email=em[0];
  const dt=t.match(/(20\d{2})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/); if(dt) r.date=`${dt[1]}-${dt[2].padStart(2,"0")}-${dt[3].padStart(2,"0")}`;
  // 연락처: 전화/연락처/담당 표시가 붙은 번호 > 휴대폰 > 첫 번호 (팩스 제외)
  const phones=[]; const pre=new RegExp("(?:\\+82[-\\s]?)?(0\\d{1,2})[)\\-.\\s]{0,2}(\\d{3,4})[-.\\s]{0,2}(\\d{4})(?!\\d)","g"); let m;
  while((m=pre.exec(t))){ const before=t.slice(Math.max(0,m.index-14),m.index);
    if(/fax|팩\s*스|F\s*[.:]?\s*$/i.test(before)) continue;
    phones.push({v:`${m[1]}-${m[2]}-${m[3]}`,s:(/(전\s*화|연\s*락|담\s*당|휴\s*대|tel|hp|h\.p|mobile|☎)/i.test(before)?2:0)+(m[1]==="010"?1:0)}); }
  if(phones.length) r.phone=phones.sort((a,b)=>b.s-a.s)[0].v;
  // 계좌: 은행 이름이나 '계좌/입금'이 있는 줄의 긴 숫자
  const bankRe=new RegExp(BANKS);
  for(let i=0;i<lines.length&&!r.account;i++){ const ln=lines[i]+" "+(lines[i+1]||"");
    if(!(bankRe.test(lines[i])||/(계\s*좌|입\s*금|예\s*금\s*주|bank)/i.test(lines[i]))) continue;
    const nums=ln.match(/\d[\d\s-]{8,22}\d/g)||[];
    const acc=nums.map(s=>s.trim()).find(s=>{const d=s.replace(/\D/g,""); return d.length>=10&&d.length<=16&&!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(s)&&!/^\d{3}-\d{2}-\d{5}$/.test(s);});
    if(acc){ r.account=acc.replace(/\s+/g,"-").replace(/-+/g,"-"); const b=ln.match(bankRe); if(b) r.bank=b[0];
      const h=ln.match(new RegExp(L("예금주")+"\\s*[:：]?\\s*([^\\s,/|]+(?:\\s?\\([^)]*\\))?)")); if(h) r.holder=h[1]; } }
  // 회사명: 상호 / 업체명 / 회사명 / 공급자 → (주)○○ 형태
  const cut=s=>squash(s.split(new RegExp("\\s(?:"+["성명","대표","사업","등록","전화","주소","업태","종목"].map(L).join("|")+")"))[0].replace(/^[:：\s]+|[\s|,]+$/g,"")).slice(0,30);
  for(const re of [new RegExp(L("상호")+"(?:\\s*\\(\\s*"+L("법인명")+"\\s*\\))?\\s*[:：]?\\s*(.+)"), new RegExp("(?:"+["업체명","회사명","공급자"].map(L).join("|")+")\\s*[:：]?\\s*(.+)")]){
    for(const ln of lines){ const x=ln.match(re); if(x){ const v=cut(x[1]); if(v.length>=2&&!/(귀\s*하|귀\s*중)$/.test(v)){ r.vendor=v; break; } } } if(r.vendor) break; }
  if(!r.vendor){ const x=t.match(/((?:\(주\)|㈜|주식회사)\s*[가-힣A-Za-z0-9&]{2,20}|[가-힣A-Za-z0-9&]{2,20}\s*(?:\(주\)|㈜))/); if(x) r.vendor=x[1].trim(); }
  // 금액: 합계·총액 줄의 가장 큰 숫자 → 없으면 문서의 가장 큰 금액
  const money=s=>(s.match(/\d{1,3}(?:,\d{3})+|\d{4,}/g)||[]).map(x=>+x.replace(/,/g,"")).filter(n=>n>=100&&n<1e10);
  const label=new RegExp("(?:"+["합계","총액","총금액","견적금액","일금","청구금액"].map(L).join("|")+"|total|₩)","i");
  let best=0; lines.forEach((ln,i)=>{ if(label.test(ln)) money(ln+" "+(/\d/.test(ln)?"":(lines[i+1]||""))).forEach(n=>{ if(n>best) best=n; }); });
  if(!best){ const all=(t.match(/\d{1,3}(?:,\d{3})+/g)||[]).map(x=>+x.replace(/,/g,"")); if(all.length) best=Math.max(...all); }
  if(best) r.amount=String(best);
  return r;
}

  if(!price){ const find=o=>{ if(!o||typeof o!=="object") return ""; if(o.offers){const of=[].concat(o.offers)[0]; if(of&&(of.price||of.lowPrice)) return of.price||of.lowPrice;}
      for(const v of Object.values(o)){const x=find(v); if(x) return x;} return ""; };
    for(const s of doc.querySelectorAll('script[type="application/ld+json"]')){ try{ price=find(JSON.parse(s.textContent)); }catch(e){} if(price) break; } }
  if(!price){ const el=doc.querySelector('[itemprop="price"]'); if(el) price=el.getAttribute("content")||el.textContent; }
  if(!price){ const x=(doc.body?doc.body.textContent:"").match(/(\d{1,3}(?:,\d{3})+)\s*원/); if(x) price=x[1]; }
  price=String(price||"").replace(/[^\d.]/g,""); price=price?String(Math.round(parseFloat(price))):"";
  let image=meta("og:image","og:image:url","twitter:image"); if(image){ try{image=new URL(image,url).href;}catch(e){image="";} }
  return {title:(meta("og:title","twitter:title")||doc.title||"").slice(0,120),image,price,site:meta("og:site_name")||new URL(url).hostname.replace(/^www\./,"")};

/* ---------- 잠금: 신분증·통장 사진 (잠금 비밀번호로 암호화해서 저장 · 팀 비밀번호만으론 못 봄) ---------- */
const LOCK_ID="cfg-lock", LOCK_ITER=200000, LOCK_IDLE=10*60*1000;
const unlocked=()=>!!ui.unlockKey;
const lockCfg=()=>state.settings.find(x=>x.id===LOCK_ID);
const b64e=buf=>{const a=new Uint8Array(buf); let s=""; for(let i=0;i<a.length;i+=8192) s+=String.fromCharCode.apply(null,a.subarray(i,i+8192)); return btoa(s);};
const b64d=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function lockKey(pw,salt){ const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:LOCK_ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]); }
async function seal(key,bytes){ const iv=crypto.getRandomValues(new Uint8Array(12)); return {iv:b64e(iv),ct:b64e(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,bytes))}; }
const unseal=(key,iv,ct)=>crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(iv)},key,b64d(ct));
let idleTimer=null;
function setUnlocked(key){ ui.unlockKey=key; clearTimeout(idleTimer); if(key) idleTimer=setTimeout(()=>{ui.unlockKey=null;toast("10분이 지나 다시 잠갔어요");render();},LOCK_IDLE); render(); }
async function unlockWith(pw){
  const c=lockCfg(); if(!c) return false;
  const key=await lockKey(pw,b64d(c.salt));
  try{ await unseal(key,c.check.iv,c.check.ct); setUnlocked(key); return true; }catch(e){ return false; }
}
async function createLock(pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)), key=await lockKey(pw,salt);
  save("settings",{id:LOCK_ID,salt:b64e(salt),check:await seal(key,new TextEncoder().encode("monet-ok"))}); setUnlocked(key);
}
async function storeSecret(file){
  if(!unlocked()) return null;

  if(blob.size>4*1048576){ toast("신분증·통장 파일은 4MB까지 올릴 수 있어요."); return null; }
  const {iv,ct}=await seal(ui.unlockKey,await blob.arrayBuffer());
  const id=uid("f"), meta={name:"locked",type:blob.type||"application/octet-stream",size:blob.size,enc:true,iv}; // 파일 이름은 남기지 않아요
  state.files.push({id,...meta});

  const {error}=await db.from(TABLE).upsert({col:"items",id,data:{meta,b64:ct},updated_at:new Date().toISOString()});
  if(error){ handleErr(error); return null; }

}

}

/* ---------- coverage ---------- */
// 하루 자리 = 배치도의 알바생 점 ('매니저'·'관리자' 점은 빼요). 점이 없으면 기본 자리표를 써요.
// 대체 인력은 층 단위로 돌아요 (작은 구역마다 따로 두면 주4일·주3일인 사람이 많아져서)
const ALLG=[{id:"fl4",name:"4층",floor:"4층",slots:[]},{id:"fl3",name:"3층",floor:"3층",slots:[]}];
const OLDG=GROUPS.concat([{id:"x4",floor:"4층"},{id:"x3",floor:"3층"}]); // 예전 구역 → 층
const pgroup=p=>{ const g=p.group||(SLOT[p.slot]||{}).group; if(ALLG.some(x=>x.id===g)) return g; const o=OLDG.find(x=>x.id===g); return o?(o.floor==="3층"?"fl3":"fl4"):g; };
const needFor=P=>Math.ceil(P*7/WORK_DAYS); // 자리 P개를 주 5일 근무로 매일 채우는 인원
function positions(){
  const ms=opMarkers().filter(m=>m.type==="staff"&&!/매니저|관리자/.test(m.label||""));
  const ps=ms.length?ms.map(m=>{const s=(m.slotId&&SLOT[m.slotId])||slotForLabel(m.label); /* 이름을 바꿔도 원래 자리 시간 유지 */ return {id:m.id,label:m.label||"이름 없는 자리",slot:s||null,group:m.floor==="3F"?"fl3":"fl4",marker:true};})
    :Object.values(SLOT).filter(s=>!s.optional).map(s=>({id:s.id,label:s.name,slot:s,group:(GROUPS.find(g=>g.id===s.group)||{}).floor==="3층"?"fl3":"fl4"}));
  const gi=id=>ALLG.findIndex(g=>g.id===id), si=s=>s?Object.keys(SLOT).indexOf(s.id):99;
  ps.sort((a,b)=>gi(a.group)-gi(b.group)||si(a.slot)-si(b.slot)||a.label.localeCompare(b.label));
  // 매일 딱 DAILY_ALBA명: 자리가 더 많으면 두 번째 자리(미디어관 2 등)·이름 모를 자리부터 예비로 빼요
  const keep=ps.slice().sort((a,b)=>((a.slot&&!a.slot.optional)?0:1)-((b.slot&&!b.slot.optional)?0:1)).slice(0,DAILY_ALBA);
  positions.spare=ps.filter(x=>!keep.includes(x));
  return ps.filter(x=>keep.includes(x));
}
function coverage(){
  // returns {res:{자리id:[{who,kind}] x7}, extra: 요일별 남는 사람, pos: 자리 목록}
  const pos=positions(), res={}, extra=DAYS.map(()=>[]), ppl=alba(), on=(p,d)=>!(p.off||[]).includes(d);
  pos.forEach(x=>res[x.id]=DAYS.map(()=>null));
  DAYS.forEach((_,d)=>{
    ALLG.forEach(g=>{
      const gp=pos.filter(x=>x.group===g.id), used=new Set();
      const work=ppl.filter(p=>pgroup(p)===g.id&&on(p,d)).sort((a,b)=>(a.kind==="대타"?1:0)-(b.kind==="대타"?1:0)||(a.order||0)-(b.order||0)); // 고정 먼저
      const fill=(x,w)=>{used.add(w.id); res[x.id][d]={who:w,kind:w.kind==="대타"?"cover":"main"};};
      gp.forEach(x=>{const w=work.find(p=>!used.has(p.id)&&(p.pos===x.id||(!p.pos&&p.slot&&x.slot&&p.slot===x.slot.id))); if(w) fill(x,w);}); // 원래 자리 먼저
      gp.forEach(x=>{ if(res[x.id][d]) return; const w=work.find(p=>!used.has(p.id)); if(w) fill(x,w); else res[x.id][d]={who:null,kind:"gap"}; });
      work.filter(p=>!used.has(p.id)).forEach(p=>extra[d].push(p));
    });
    ppl.filter(p=>!ALLG.some(g=>g.id===pgroup(p))&&on(p,d)).forEach(p=>extra[d].push(p));
  });
  return {res,extra,pos};
}
const pname=p=>p? (p.name||(isMgr(p)?"매니저":`알바 ${String(p.code||"").replace(/\D/g,"")||"?"}`)):""; // 이름이 없으면 알바 N
const WORK_DAYS=5; // 알바 주 근무일 (최대)
const DAILY_ALBA=11; // 매일 딱 이 인원 (운영매니저 제외)

function fitPop(box){ const pop=box&&box.querySelector(".mkpop"); if(!pop) return;
  const sc=box.closest(".plan-scroll")||box, pr=box.getBoundingClientRect(), sr=sc.getBoundingClientRect();
  const v={top:Math.max(pr.top,sr.top),bottom:Math.min(pr.bottom,sr.bottom),left:Math.max(pr.left,sr.left),right:Math.min(pr.right,sr.right)};
  if(v.bottom-v.top<40) return; pop.style.maxHeight=(v.bottom-v.top-8)+"px"; pop.style.overflowY="auto";
  const r=pop.getBoundingClientRect(); let dy=0, dx=0;
  if(r.top<v.top+4) dy=v.top+4-r.top; else if(r.bottom>v.bottom-4) dy=v.bottom-4-r.bottom;
  if(r.left<v.left+4) dx=v.left+4-r.left; else if(r.right>v.right-4) dx=v.right-4-r.right;
  if(dy) pop.style.marginTop=dy+"px"; if(dx) pop.style.marginLeft=dx+"px"; }
function popPos(x,y){ return `left:${x}%;top:${y}%;transform:translate(${x<30?"-14px":x>70?"calc(-100% + 14px)":"-50%"},${y>48?"calc(-100% - 18px)":"18px"})`; }

const slotForLabel=label=>{ const l=String(label||""); // 바꾼 이름·원래 이름 모두, 긴 이름 먼저 ("④ 미디어관 2" > "④ 미디어관")
  let best=null,len=0; Object.values(SLOT).forEach(s=>[s.name,SLOT_ORIG[s.id].name].forEach(n=>{ if(l.startsWith(n)&&n.length>len){best=s;len=n.length;} })); return best; };

/* ----- staff ----- */
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dowOf=date=>(new Date(date+"T00:00").getDay()+6)%7;
const toMin=t=>{const m=String(t||"").match(/(\d{1,2}):(\d{2})/); return m?(+m[1])*60+(+m[2]):null;};

/* ----- 근무표 (요일 × 근무 시간대, 이름) ----- */
const posCfg=()=>(state.settings.find(x=>x.id==="cfg-pos")||{}).pos||{};
const posTime=x=>(posCfg()[x.id]||{}).time||(x.slot&&x.slot.time)||"11:00~20:00";
const posBrk=x=>{ const b=(posCfg()[x.id]||{}).brk||(x.slot&&x.slot.brk)||""; return /\d:\d\d/.test(b)?b.split("~")[0]:""; };
// 날짜별 주간 근무표: 매주 같은 휴무표를 실제 날짜에 펼치고, 그날만 사람을 바꿀 수 있어요 (cfg-ovr: {날짜:{자리:사람}})
const ovrAll=()=>(state.settings.find(x=>x.id==="cfg-ovr")||{}).days||{};
const weekDates=mon=>DAYS.map((_,i)=>{ const d=new Date(mon+"T00:00"); d.setDate(d.getDate()+i); return ymd(d); });
const curWeek=()=>{ const lo=weekKey(WORK_FROM), hi=weekKey(OPEN_TO), t=weekKey(ymd(new Date())); const w=ui.rotaWeek||(t<lo?lo:t>hi?hi:t); return w<lo?lo:w>hi?hi:w; };
// 날짜별 계산에 필요한 것 한 번에: 주간표, 남는 사람(지원), 야간 인원, 야간 주에 빼는 날
function planCtx(){ const {res,extra,pos}=coverage(), crews=nightCrews().crews; return {res,extra,pos,crews,drops:nightDrops(pos,extra,crews,res),first:firstWeekOff(pos)}; }
function firstWeekOff(pos){ // 첫 주 12/3~6 중 쉬는 하루: 층마다 그날 자리가 모자라지 않게 고르게 (매주 필수 휴무 요일 먼저)
  const ds=[]; for(let d=OPEN_FROM;d<=FIRST_END;d=addDay(d,1)) ds.push(d);
  const off={}; ALLG.forEach(g=>{ const mem=alba().filter(p=>pgroup(p)===g.id).sort((a,b)=>(a.order||0)-(b.order||0)), P=pos.filter(x=>x.group===g.id).length, cap={}; ds.forEach(d=>cap[d]=Math.max(0,mem.length-P));
    mem.forEach((p,i)=>{ const want=ds.find(d=>mustDow(p).includes(dowOf(d))&&cap[d]>0); const d=want||ds.slice().sort((a,b)=>cap[b]-cap[a]||ds.indexOf(a)-ds.indexOf(b))[0]; if(d&&cap[d]>0){ off[p.id]=d; cap[d]--; } }); });
  return off;
}
function nightDrops(pos,extra,crews,res){ // 야간을 해서 40시간이 넘는 사람은 그 주에 지원 인원이 있는 날 하루를 쉬어요
  const drops={}, weeks={};
  Object.entries(crews).forEach(([d,cs])=>cs.forEach(p=>{ const w=weekKey(d), m=(weeks[w]=weeks[w]||{}); (m[p.id]=m[p.id]||{p,dates:[]}).dates.push(d); }));
  Object.entries(weeks).forEach(([w,map])=>{ const used={};
    Object.values(map).forEach(({p,dates})=>{ if(actDays(p)*personNet(p,pos)+NIGHT_H*dates.length<=MAX_H) return;
      const sur=dt=>extra[dowOf(dt)].filter(q=>q.id!==p.id).length-(used[dt]||0); // 그날 지원 인원 (다른 층도 가능)
      const pick=weekDates(w).filter(dt=>dt>=OPEN_FROM&&dt<=OPEN_TO&&!dates.includes(dt)&&pos.some(x=>res[x.id][dowOf(dt)].who===p)&&sur(dt)>0) // 자리를 맡은 날 중 대신할 사람이 있는 날
        .sort((a,b)=>sur(b)-sur(a)||a.localeCompare(b))[0];
      if(pick){ (drops[pick]=drops[pick]||new Set()).add(p.id); used[pick]=(used[pick]||0)+1; /* 지원 인원 한 명을 쓴 셈 */ } }); });
  return drops;
}
function dayPlan(ctx,date){ // 그날 자리별 사람 (바꾼 사람·대체 반영), 지원, 야간, 휴무
  const {pos,res}=ctx, d=dowOf(date), ov=ovrAll()[date]||{}, ppl=alba(), byId=id=>ppl.find(p=>p.id===id);
  if(isClosed(date)){ const cells={}; pos.forEach(x=>cells[x.id]={who:null,kind:"closed"}); return {cells,crew:[],off:ppl.slice(),working:new Set(),extras:[],spare:[],closed:true}; } // 휴관
  if(date>=WORK_FROM&&date<OPEN_FROM){ // OT·시뮬레이션: 전원 (필수 휴무 날짜만 빼고)
    const w=ppl.filter(p=>!mustDates(p).includes(date)), cells={}; pos.forEach(x=>cells[x.id]={who:null,kind:"prep"});
    return {cells,crew:[],off:ppl.filter(p=>!w.includes(p)),working:new Set(w.map(p=>p.id)),extras:[],prep:w}; }
  if(date>=OPEN_FROM&&date<=FIRST_END){ // 첫 주: 각자 정해진 하루만 쉬고 나머지는 근무
    const w=ppl.filter(p=>ctx.first[p.id]!==date&&!mustDates(p).includes(date)&&!mustDow(p).includes(d)), left=new Set(w.map(p=>p.id)), cells={};
    pos.forEach(x=>{ const base=res[x.id][d].who, o=ov[x.id]&&byId(ov[x.id]); let who=o&&left.has(o.id)?o:base&&left.has(base.id)?base:null; if(who){ cells[x.id]={who,kind:o?"swap":"main"}; left.delete(who.id); } });
    pos.forEach(x=>{ if(cells[x.id]) return; const q=w.find(p=>left.has(p.id)&&pgroup(p)===x.group)||w.find(p=>left.has(p.id)); if(q){ cells[x.id]={who:q,kind:"cover"}; left.delete(q.id); } else cells[x.id]={who:null,kind:"gap"}; });
    const spare=w.filter(p=>left.has(p.id)), wk=w.filter(p=>!left.has(p.id));
    return {cells,crew:[],off:ppl.filter(p=>!wk.includes(p)),working:new Set(wk.map(p=>p.id)),extras:[],spare}; }
  const crew=ctx.crews[date]||[], dropped=ctx.drops[date]||new Set();
  const cells={}; pos.forEach(x=>{ const base=res[x.id][d]; const o=ov[x.id]&&byId(ov[x.id]);
    cells[x.id]=o?{who:o,kind:"swap",base:base.who}:{who:base.who,kind:base.kind}; });
  const inCell=()=>new Set(Object.values(cells).map(c=>c.who&&c.who.id).filter(Boolean));
  let extras=ctx.extra[d].filter(p=>!dropped.has(p.id)&&!mustDates(p).includes(date)&&!inCell().has(p.id));
  const fill=(x,base,why)=>{ let i=extras.findIndex(q=>pgroup(q)===x.group); if(i<0) i=extras.findIndex(()=>true); /* 같은 층 먼저, 없으면 다른 층 */ if(i>=0){ cells[x.id]={who:extras[i],kind:"auto",base,why}; extras.splice(i,1); return true; } return false; };
  // 야간 주에 빠지는 사람 → 같은 층 지원 인원이 그 자리로
  pos.forEach(x=>{ const c=cells[x.id]; if(c.kind!=="swap"&&c.who&&dropped.has(c.who.id)) fill(x,c.who,"야간 주 휴무"); });
  // 필수 휴무 날짜인 사람 → 지원 인원 먼저, 없으면 그날 쉬는 사람 (40시간 안 넘는 사람 먼저)
  pos.forEach(x=>{ const c=cells[x.id]; if(c.kind==="swap"||!c.who||!mustDates(c.who).includes(date)) return;
    if(fill(x,c.who,"필수 휴무")) return;
    const busy=new Set([...inCell(),...crew.map(p=>p.id),...extras.map(p=>p.id)]);
    const sub=ppl.filter(p=>!busy.has(p.id)&&!mustDates(p).includes(date)&&!mustDow(p).includes(d)).sort((a,b)=>(dayDays(a)>=WORK_DAYS?1:0)-(dayDays(b)>=WORK_DAYS?1:0)||(pgroup(a)===x.group?0:1)-(pgroup(b)===x.group?0:1)||(a.order||0)-(b.order||0))[0];
    cells[x.id]=sub?{who:sub,kind:"auto",base:c.who,why:"필수 휴무"}:{who:null,kind:"gap",base:c.who}; });
  extras=extras.filter(p=>!inCell().has(p.id));
  const working=inCell(); // 자리를 다 채우고 남는 사람은 그날 쉬어요 (지원 근무 없음)
  const off=ppl.filter(p=>!working.has(p.id)&&!crew.some(c=>c.id===p.id));
  return {cells,crew,off,working,extras:[],spare:extras};
}
function rotaHTML(pos,res){
  const mgr=state.staff.find(isMgr), mon=curWeek(), dates=weekDates(mon), open=dt=>dt>=WORK_FROM&&dt<=OPEN_TO;
  const ctx=planCtx(), plans=dates.map(dt=>dayPlan(ctx,dt));
  // 그 주 근무일 (주간+야간) → 5일 넘으면 빨간 테두리
  // 그 주 근무시간 (주간: 자리 시간에서 휴게 1시간 뺌, 야간 3시간) → 40시간 넘으면 빨간 테두리
  const wk={}; plans.forEach((pl,i)=>{ if(!open(dates[i])) return; (pl.prep||[]).forEach(p=>wk[p.id]=(wk[p.id]||0)+8); pos.forEach(x=>{ const c=pl.cells[x.id]; if(c.who) wk[c.who.id]=(wk[c.who.id]||0)+netH(posTime(x)); }); pl.extras.forEach(p=>wk[p.id]=(wk[p.id]||0)+personNet(p,pos)); pl.crew.forEach(p=>wk[p.id]=(wk[p.id]||0)+NIGHT_H); });
  const over=p=>p&&(wk[p.id]||0)>MAX_H;
  const secs={}; pos.forEach(x=>(secs[posTime(x)]=secs[posTime(x)]||[]).push(x));
  const keys=Object.keys(secs).sort((a,b)=>toMin(a)-toMin(b));
  const lo=weekKey(WORK_FROM), hi=weekKey(OPEN_TO);
  const nav=`<div class="row noprint" style="justify-content:space-between;margin-bottom:8px"><button class="btn small" data-wk="-7" ${mon<=lo?"disabled":""}>‹ 지난주</button>
    <b>${+dates[0].slice(5,7)}/${+dates[0].slice(8)} ~ ${+dates[6].slice(5,7)}/${+dates[6].slice(8)}</b><button class="btn small" data-wk="7" ${mon>=hi?"disabled":""}>다음주 ›</button></div>`;
  const head=`<tr><th class="rl">근무</th>${dates.map((dt,i)=>`<th class="${i>=5?"we":""} ${dt===ymd(new Date())?"today":""}">${DAYS[i]}<br><span class="small num">${+dt.slice(5,7)}/${+dt.slice(8)}</span>${state.sched.filter(x=>x.kind==="milestone"&&x.date===dt).map(x=>`<br><span class="mslbl">${esc(x.label)}</span>`).join("")}${isClosed(dt)?`<br><span class="mslbl">휴관</span>`:""}</th>`).join("")}</tr>`;
  const sec=(title,sub)=>`<tr class="sec"><th colspan="8">${title}${sub?` <span class="small">${sub}</span>`:""}</th></tr>`;
  const net=t=>{ const [a,b]=t.split("~").map(toMin); return a!=null&&b!=null?(b-a-60)/60:null; };
  const closed=`<td class="closed">휴관</td>`;
  let body=keys.map(t=>sec(t,`휴게 1시간 · 하루 ${net(t)}시간`)+secs[t].map(x=>`<tr data-pos="${x.id}" class="${ui.hiPos===x.id?"rowsel":""}"><td class="rl">${ui.editPos===x.id?`<input class="posname" data-posname="${x.id}" value="${esc(x.label)}">`:`<button class="poslbl" data-posedit="${x.id}" title="눌러서 자리 이름 바꾸기">${esc(x.label)}</button>`}${posBrk(x)?`<span class="brk">☕ ${posBrk(x)}</span>`:""}</td>${dates.map((dt,i)=>{ if(!open(dt)) return closed;
      const c=plans[i].cells[x.id], key=dt+"|"+x.id; if(c.kind==="prep") return `<td class="closed">OT·시뮬</td>`; if(c.kind==="closed") return `<td class="closed">휴관</td>`;
      if(ui.editCell===key){ const pl=plans[i], free=alba().filter(p=>!pl.working.has(p.id)||p.id===(c.who&&c.who.id)).sort((a,b)=>(wk[a.id]||0)-(wk[b.id]||0)||(a.order||0)-(b.order||0)); // 덜 일한 사람 먼저
        return `<td class="editing"><select data-swap="${key}"><option value="">${c.kind==="swap"?"원래대로":"그대로"}</option>${free.map(p=>`<option value="${p.id}" ${c.who&&c.who.id===p.id?"selected":""}>${esc(pname(p))}${pl.crew.some(q=>q.id===p.id)?" (야간)":""} · 주${+(wk[p.id]||0).toFixed(1)}시간</option>`).join("")}</select></td>`; }
      const cls=c.kind==="gap"?"gap":c.kind==="swap"||c.kind==="auto"?"swp":"";
      return `<td class="${cls} ${over(c.who)?"over":""}"><button class="cellbtn" data-cell="${key}" title="${c.kind==="auto"?esc(pname(c.base))+" "+(c.why||"")+" → 자동 대체":"이날만 사람 바꾸기"}">${c.who?esc(pname(c.who)):"빈자리"}</button></td>`; }).join("")}</tr>`).join("")).join("");

  const P=id=>per[id]=per[id]||{days:0,nights:0,m:{}}, M=k=>months[k]=months[k]||{days:0,nights:0,open:0,from:null,to:null};

function sortItems(rows,qtyOf,amt){

const shopGroup=x=>x.src==="coupang"||/쿠팡|coupang/i.test(x.mall||"")?"coupang":/네이버|naver|스마트스토어/i.test(x.mall||"")?"naver":"etc";

const SHOP_N=20;

const shopQuery=t=>String(t||"").replace(/\[[^\]]*\]|【[^】]*】/g," ").replace(/[^\p{L}\p{N}\s.\-]/gu," ").replace(/\s+/g," ").trim().split(" ").slice(0,6).join(" ");
const shopLinks=q=>`<a class="small" href="https://search.shopping.naver.com/search/all?query=${encodeURIComponent(q)}" target="_blank" rel="noopener noreferrer">네이버 쇼핑에서 보기</a> · <a class="small" href="https://www.coupang.com/np/search?q=${encodeURIComponent(q)}" target="_blank" rel="noopener noreferrer">쿠팡에서 보기</a>`;
async function shopSearch(itemId,q,sim){
  q=String(q||"").trim().slice(0,100); if(q.length<2){ toast("두 글자 이상 적어 주세요"); return; }
  const prev=ui.shop[itemId]||{}; ui.shop[itemId]={q,sim:sim||null,loading:true,src:"",sort:prev.sort||""}; render();
  let res=null, err="";
  try{ if(!db||mode!=="db") throw new Error("offline");
    const {data,error}=await db.functions.invoke("shop-search",{body:{q,n:SHOP_N}});
    if(error){ const st=error.context&&error.context.status; err=st===403?"검색 권한이 없어요. 다시 로그인해 주세요.":st===404?"검색 기능이 아직 설치되지 않았어요.":"검색하지 못했어요. 잠시 후 다시 해 주세요."; console.error(error); }
    else res=data; }
  catch(e){ console.error(e); err="검색하지 못했어요. 인터넷 연결을 확인해 주세요."; }
  const cur=ui.shop[itemId]; if(!cur||cur.q!==q) return; // 그 사이 다른 검색을 했으면 버려요
  ui.shop[itemId]={...cur,loading:false,res,err}; scheduleRender();
}
function priceStats(list,ref){
  let p=list.map(x=>x.price).filter(v=>v>0), cut=0;
  if(ref>0){ const k=p.filter(v=>v>=ref/3&&v<=ref*3); cut=p.length-k.length; p=k; } // 기준보다 3배 넘게 차이 나는 건 다른 물건일 가능성이 커서 빼요
  p.sort((a,b)=>a-b); if(!p.length) return null;
  const at=f=>p[Math.round(f*(p.length-1))];
  return {n:p.length,cut,min:p[0],max:p[p.length-1],med:at(.5),lo:at(.25),hi:at(.75)};
}

      ${i.kind!==OWNED?`<button class="btn small" data-sprice="${st.min}" type="button">최저가를 단가로</button><button class="btn small" data-sprice="${st.med}" type="button">가운데값을 단가로</button>`:""}</div>`:"";

      <div class="pr"><b class="num">${x.price?won(x.price):"–"}</b>${x.price?"원":""}</div>

function undoToast(msg,undo,done){
  const t=$("#toast"); clearTimeout(toast._t); if(undoToast._done) undoToast._done();
  t.textContent=msg+" "; const b=document.createElement("button"); b.type="button"; b.className="toastbtn"; b.textContent="되돌리기"; t.append(b); t.hidden=false;
  const fin=()=>{ undoToast._done=null; clearTimeout(toast._t); t.hidden=true; };
  undoToast._done=()=>{ fin(); if(done) done(); };
  b.onclick=()=>{ fin(); undo(); toast("되돌렸어요"); };
  toast._t=setTimeout(()=>undoToast._done&&undoToast._done(),8000);
}

/* 들어갈 내용: '01 작가 · 작품 (A1 세로)' 줄들은 표로, 나머지는 줄마다 목록으로 */
const ART_RE=/^\s*(\d+)\s+(.+?)\s*·\s*(.+?)\s*(?:\(([^)]*)\))?\s*$/;
function gContent(c){
  const ls=String(c||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
  if(!ls.length) return `<p class="small muted" style="margin:0">들어갈 내용 미정</p>`;
  const m=ls.map(l=>l.match(ART_RE));
  if(m.every(Boolean)) return `<div class="tbl-wrap"><table class="gart"><thead><tr><th>번호</th><th>크기</th><th>작품</th></tr></thead><tbody>${m.map(x=>{ const [sz,...rest]=String(x[4]||"").split(/\s+/);
    return `<tr><td class="num gart-no">${esc(x[1])}</td><td class="gart-sz"><b class="num">${esc(sz||"")}</b> <span class="muted">${esc(rest.join(" "))}</span></td><td><span class="small muted">${esc(x[2])}</span> · ${esc(x[3])}</td></tr>`; }).join("")}</tbody></table></div>`;
  return `<ul class="glist">${ls.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`;
}
/* 크기별 개수: 'A1 ×4 · A2 ×3 · 총 9점' + 벽 크기 */
function gSummary(g){
  const ls=String(g.content||"").split(/\n+/).map(x=>x.trim()).filter(Boolean), m=ls.map(l=>l.match(ART_RE));
  const out=[];
  if(ls.length&&m.every(Boolean)){ const c={}; m.forEach(x=>{ const k=(String(x[4]||"").split(/\s+/)[0])||"크기 미정"; c[k]=(c[k]||0)+1; });
    out.push(`<b class="gtotal">총 ${m.length}점</b>`); Object.keys(c).sort().forEach(k=>out.push(`<span class="gsz"><b class="num">${esc(k)}</b> ×${c[k]}</span>`)); }
  const wall=String(g.size||"").match(/벽\s*([\d,]+)/);
  if(wall) out.push(`<span class="gsz muted">벽 폭 <b class="num">${esc(wall[1])}</b></span>`);
  else if(g.size&&!out.length) out.push(`<span class="gsz"><b class="num">${esc(g.size)}</b></span>`);
  return out.join("");
}
/* 도면에서 이 그래픽 자리 (선 주변을 크게) */
function gMini(g){
  const mx=(g.x1+g.x2)/2, my=(g.y1+g.y2)/2, Z=3, cl=v=>Math.max(-100*(Z-1),Math.min(0,v));
  return `<div class="gmini" aria-label="${g.floor==="4F"?"4층":"3층"} 도면 위치"><div class="gmini-in" style="width:${Z*100}%;height:${Z*100}%;left:${cl(50-mx*Z)}%;top:${cl(50-my*Z)}%">
    <img src="${PLAN[g.floor]}" alt=""><svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="${g.x1}" y1="${g.y1}" x2="${g.x2}" y2="${g.y2}" style="stroke:${gcolor(g.type)}" vector-effect="non-scaling-stroke"/></svg></div>
    <span class="small">${g.floor==="4F"?"4층":"3층"} 위치</span></div>`;
}
function zoomGfx(g){
  const f=(g.files||[]).slice(-1)[0]; /* 원본이 사진이면 선명한 원본으로 바꿔 보여 줘요 */
  zoomImg(g.image,g.label,f&&(/^image\//.test(f.type||"")||/\.(jpe?g|png|webp|gif)$/i.test(f.name||""))?f.fileId:null);
}

  const byFloor=["4F","3F"].map(fl=>{ const gs2=full.filter(g=>g.floor===fl); return gs2.length?`<h4 class="gfl">${fl==="4F"?"4층":"3층"} <span class="small muted">${gs2.length}개</span></h4><div class="gcards">${gs2.map(card).join("")}</div>`:""; }).join("");

function bindGfx(){
  document.querySelectorAll("[data-floor]").forEach(b=>b.onclick=()=>{ui.floor=b.dataset.floor;ui.gSel=null;ui.gStart=null;try{localStorage.setItem("mb-floor",ui.floor)}catch(e){};render();});
  document.querySelectorAll("[data-vis]").forEach(b=>b.onclick=()=>{const k=b.dataset.vis;ui.hidden.has(k)?ui.hidden.delete(k):ui.hidden.add(k);render();});
  document.querySelectorAll("[data-gadd]").forEach(b=>b.onclick=()=>{ui.gAdd=ui.gAdd===b.dataset.gadd?null:b.dataset.gadd;ui.gStart=null;render();});
  $("#lblToggle").onchange=e=>{ui.labels=e.target.checked;render();};
  $("#planEditBtn").onclick=()=>{ui.planEdit=!ui.planEdit;ui.gAdd=null;ui.gStart=null;ui.confirmDel=null;if(!ui.planEdit) toast("위치를 잠갔어요");render();};
  document.querySelectorAll("[data-gdl-row]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const g=state.graphics.find(x=>x.id===b.dataset.gdlRow), f=g.files[g.files.length-1]; downloadFile(f.fileId,f.name); });
  document.querySelectorAll("[data-gzoom]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const g=state.graphics.find(x=>x.id===b.dataset.gzoom); if(g) zoomGfx(g); });
  document.querySelectorAll("[data-grow]").forEach(tr=>tr.onclick=()=>{const g=state.graphics.find(x=>x.id===tr.dataset.grow); if(!g) return; ui.gSel=g.id; ui.floor=g.floor; render(); window.scrollTo({top:0,behavior:"smooth"});});
  const plan=$("#gplan");
  const pt=e=>{const r=plan.getBoundingClientRect(); return {x:+Math.min(99.5,Math.max(.5,(e.clientX-r.left)/r.width*100)).toFixed(2),y:+Math.min(99.5,Math.max(.5,(e.clientY-r.top)/r.height*100)).toFixed(2)};};
  { const px=plan.querySelector("[data-popx]"); if(px) px.onclick=()=>{ui.gSel=null;render();}; fitPop(plan);
    const pz=plan.querySelector("[data-popzoom]"); if(pz) pz.onclick=()=>{ const g=state.graphics.find(x=>x.id===ui.gSel); if(g) zoomGfx(g); };
    const pg=plan.querySelector("[data-popgo]"); if(pg) pg.onclick=()=>goRow(`[data-grow="${ui.gSel}"]`); }
  plan.addEventListener("pointerdown",e=>{
    if(e.target.closest(".mkpop")) return;
    const h=e.target.closest(".ghandle[data-h]"), b=e.target.closest("[data-g]");
    if(h&&ui.planEdit){ // 끝점 끌기
      e.preventDefault(); h.setPointerCapture(e.pointerId); const g=state.graphics.find(x=>x.id===ui.gSel), k=h.dataset.h; let p=null;
      const mv=ev=>{p=pt(ev); h.style.left=p.x+"%"; h.style.top=p.y+"%";};
      h.addEventListener("pointermove",mv); h.addEventListener("pointerup",()=>{h.removeEventListener("pointermove",mv); if(p) save("graphics",{...g,["x"+k]:p.x,["y"+k]:p.y});},{once:true}); return; }
    if(b){ const g=state.graphics.find(x=>x.id===b.dataset.g); if(!g) return;
      if(!ui.planEdit){ ui.gSel=ui.gSel===g.id?null:g.id; ui.confirmDel=null; render(); return; }
      e.preventDefault(); b.setPointerCapture(e.pointerId); const s=pt(e); let moved=false, d={x:0,y:0};
      const mv=ev=>{const p=pt(ev); d={x:p.x-s.x,y:p.y-s.y}; if(Math.abs(d.x)+Math.abs(d.y)>.5) moved=true; if(moved){ b.style.left=(g.x1+g.x2)/2+d.x+"%"; b.style.top=(g.y1+g.y2)/2+d.y+"%"; }};
      b.addEventListener("pointermove",mv);
      b.addEventListener("pointerup",()=>{ b.removeEventListener("pointermove",mv); const r=v=>+v.toFixed(2);
        if(moved) save("graphics",{...g,x1:r(g.x1+d.x),y1:r(g.y1+d.y),x2:r(g.x2+d.x),y2:r(g.y2+d.y)}); else { ui.gSel=ui.gSel===g.id?null:g.id; ui.confirmDel=null; render(); if(ui.gSel) goRow(`tr[data-grow="${g.id}"]`); } },{once:true}); return; }
    if(ui.planEdit&&ui.gAdd){ const p=pt(e);
      if(!ui.gStart){ ui.gStart=p; render(); return; }
      const g={id:uid("g"),floor:ui.floor,type:ui.gAdd,x1:ui.gStart.x,y1:ui.gStart.y,x2:p.x,y2:p.y,label:"",content:"",size:"",status:"내용 정리",note:""};
      ui.gStart=null; ui.gSel=g.id; save("graphics",g); return; }
    if(ui.gSel){ ui.gSel=null; render(); }
  });
  const sel=state.graphics.find(g=>g.id===ui.gSel); if(!sel) return;
  const upd=patch=>save("graphics",{...state.graphics.find(g=>g.id===ui.gSel),...patch});
  $("#g-type").onchange=e=>upd({type:e.target.value});
  ["label","content","size","note"].forEach(k=>$("#g-"+k).onchange=e=>upd({[k]:e.target.value.trim()}));
  $("#g-status").onchange=e=>upd({status:e.target.value});
  dropZone($("#g-img"),{accept:"application/pdf,image/*",onFiles:async fs=>{ const f=fs[0], id=sel.id;
      if(!isPdf(f)&&!/^image\//.test(f.type)){ toast("PDF나 이미지 파일만 올릴 수 있어요."); return; }
      if(f.size>MAX_FILE){ toast(`파일이 너무 커요. ${mb(MAX_FILE)}MB까지 올릴 수 있어요.`); return; }
      toast("올리는 중…");
      const [thumb,fid]=await Promise.all([makeThumb(f).catch(e=>{console.error(e);return null;}),storeFile(f,true)]); if(!fid) return;
      const g=state.graphics.find(x=>x.id===id); if(!g) return;
      const v=Math.max(0,...(g.files||[]).map(x=>x.v||0))+1, name=vname(f.name,v);
      save("graphics",{...g,files:[...(g.files||[]),{v,fileId:fid,name,type:f.type,size:f.size,at:new Date().toISOString().slice(0,10)}],image:thumb||g.image},true);
      toast(`${name}(으)로 올렸어요`); },
    onText:t=>{ if(/^https?:\/\//.test(t)) upd({image:t}); }});
  document.querySelectorAll("[data-gdl]").forEach(b=>b.onclick=()=>{ const f=(sel.files||[]).find(x=>x.fileId===b.dataset.gdl); downloadFile(f.fileId,f.name); });
  document.querySelectorAll("[data-gfdel]").forEach(b=>b.onclick=()=>{ const f=(sel.files||[]).find(x=>x.fileId===b.dataset.gfdel); if(!confirm(`${f.name}을(를) 지울까요?`)) return;
    remove("files",f.fileId); upd({files:sel.files.filter(x=>x.fileId!==f.fileId)}); });
  $("#g-close").onclick=()=>{ui.gSel=null;render();};
  if($("#g-del")) $("#g-del").onclick=()=>{ if(ui.confirmDel===sel.id){ui.confirmDel=null;ui.gSel=null;remove("graphics",sel.id);} else {ui.confirmDel=sel.id;render();} };
}

function seedGraphics(){
  if(!loaded.settings||state.settings.some(x=>x.id==="cfg-gfx-seed")) return;
  if(!state.graphics.length) GFX_SEED.forEach(([floor,type,x1,y1,x2,y2,label],i)=>save("graphics",{id:`g-seed-${String(i+1).padStart(2,"0")}`,floor,type,x1,y1,x2,y2,label,content:"",size:"",status:"내용 정리",note:""},true));

/* ----- 운영 문서 (운영 시나리오 · 인력 교육) : .docx 를 올리면 웹 문서로 읽어요 ----- */
const JSZIP="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
const manCache={};

async function parseDocx(file){
  await loadScript(JSZIP);
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const rd=async n=>{ const f=zip.file(n); return f?new DOMParser().parseFromString(await f.async("string"),"application/xml"):null; };
  const [doc,sty,num]=await Promise.all([rd("word/document.xml"),rd("word/styles.xml"),rd("word/numbering.xml")]);
  if(!doc) throw new Error("docx");
  const kids=(el,tag)=>Array.from(el.children).filter(c=>c.tagName===tag);
  const kid=(el,tag)=>el&&Array.from(el.children).find(c=>c.tagName===tag);
  const val=el=>el&&el.getAttribute("w:val");
  const sname={}; if(sty) Array.from(sty.getElementsByTagName("w:style")).forEach(st=>sname[st.getAttribute("w:styleId")]=(val(kid(st,"w:name"))||"").toLowerCase());
  const bullet={}; // numId → 0단계 글머리표
  if(num){ const abs={}; Array.from(num.getElementsByTagName("w:abstractNum")).forEach(a=>{ const l=kid(a,"w:lvl"); abs[a.getAttribute("w:abstractNumId")]=l?{t:val(kid(l,"w:lvlText"))||"",f:val(kid(l,"w:numFmt"))||""}:{t:"•",f:"bullet"}; });
    Array.from(num.getElementsByTagName("w:num")).forEach(n=>{ const a=abs[val(kid(n,"w:abstractNumId"))]; if(a) bullet[n.getAttribute("w:numId")]=a.f==="bullet"?(a.t||"•"):"·"; }); }
  const ptext=p=>{ let t=""; p.querySelectorAll("*").forEach(e=>{ if(e.tagName==="w:t") t+=e.textContent; else if(e.tagName==="w:tab") t+=" "; else if(e.tagName==="w:br"||e.tagName==="w:cr") t+="\n"; }); return t.replace(/[  ]+/g," ").trim(); };
  const out=[];
  const body=doc.getElementsByTagName("w:body")[0];
  for(const el of Array.from(body.children)){
    if(el.tagName==="w:p"){
      const pPr=kid(el,"w:pPr"), sid=val(kid(pPr,"w:pStyle"))||"", nm=sname[sid]||sid.toLowerCase(), numPr=kid(pPr,"w:numPr");
      const x=ptext(el), img=el.getElementsByTagName("w:drawing").length>0;
      if(img) out.push({t:"img"});
      if(!x) continue;
      const h=nm.match(/heading\s*(\d)/)||sid.match(/^Heading(\d)$/);
      if(h) out.push({t:"h"+Math.min(3,+h[1]),x});
      else if(numPr||/list/.test(nm)) out.push({t:"li",x,b:numPr?bullet[val(kid(numPr,"w:numId"))]||"•":"•"});
      else out.push({t:"p",x});
    } else if(el.tagName==="w:tbl"){
      const rows=kids(el,"w:tr").map(tr=>kids(tr,"w:tc").map(tc=>{ const span=+(val(kid(kid(tc,"w:tcPr"),"w:gridSpan"))||1);
        const x=kids(tc,"w:p").map(ptext).filter(Boolean).join("\n"); return span>1?{x,s:span}:x; }));
      const flat=rows.flat();
      if(rows.length===1&&rows[0].length===1) out.push({t:"note",x:typeof flat[0]==="string"?flat[0]:flat[0].x});
      else if(flat.some(c=>(c.x??c))) out.push({t:"tbl",rows});
    }
  }
  return out;
}
function manSplit(blocks){ // 첫 제목 앞 = 표지
  const i=blocks.findIndex(b=>b.t==="h1"); const head=i<0?[]:blocks.slice(0,i), body=i<0?blocks:blocks.slice(i);
  const ps=head.filter(b=>b.t==="p").map(b=>b.x);
  let eb="", title=ps[0]||"", sub=[]; if(ps.length>1&&/MONET|모네/i.test(ps[0])){ eb=ps[0]; title=ps[1]; sub=ps.slice(2); } else sub=ps.slice(1);
  return {eb,title,sub,notes:head.filter(b=>b.t==="note").map(b=>b.x),body};
}
async function manBlocks(d){

/* ----- 일정 (시공 공정표) ----- */
const SCHED_FROM="2026-11-09", SCHED_TO="2026-12-03", SHIFTS=["주간","야간"];
const addDay=(date,n)=>{ const d=new Date(date+"T00:00"); d.setDate(d.getDate()+n); return ymd(d); };
const md=d=>`${+d.slice(5,7)}/${+d.slice(8)}`;
const sStart=x=>x.start||x.date||"", sEnd=x=>x.end||x.start||x.date||"";
const dayDiff=(a,b)=>Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5);
try{ ui.schedView=localStorage.getItem("mb-schedview")||"day"; ui.schedHide=new Set(JSON.parse(localStorage.getItem("mb-schedhide")||"[]")); }catch(e){ ui.schedView="day"; ui.schedHide=new Set(); }
function schedModel(){

  const from=[cfg.from||SCHED_FROM,...all].sort()[0], to=[cfg.to||SCHED_TO,...all].sort().slice(-1)[0];
  const days=[]; for(let d=from;d<=to&&days.length<200;d=addDay(d,1)) days.push(d);
  const vendors=[...new Set([...(cfg.vendors||[]),...bars.map(b=>b.vendor).filter(Boolean)])];
  const color=v=>`var(--v${(Math.max(0,vendors.indexOf(v))%7)+1})`;
  return {cfg,bars,ms,days,from,to,vendors,color,notes:cfg.notes||{},today:ymd(new Date())};
}
const vstyle=(M,v)=>`style="--c:${M.color(v)}"`;
function schedHTML(){
  const M=schedModel(), hide=ui.schedHide, shown=M.vendors.filter(v=>!hide.has(v));

  const notes=shown.filter(v=>M.notes[v]).map(v=>`<div class="small" style="margin-top:6px"><span class="vtag" ${vstyle(M,v)}>${esc(v)}</span> ${esc(M.notes[v])}</div>`).join("");
  const top=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">시공 일정 <span class="small muted">${md(M.from)} ~ ${md(M.to)}</span></h3>

function agendaHTML(M,bars){
  let out="", wk=-1;

    const w=Math.floor(i/7); if(w!==wk){ wk=w; const e=M.days[Math.min(M.days.length-1,i+6)]; out+=`<div class="sweek">${w+1}주차 · ${md(d)} ~ ${md(e)}</div>`; }
