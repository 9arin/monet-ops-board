<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>MONET 100 운영 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 운영 현장의 종이 도면 + 화이트보드 마커: 도면이 주인공, 범례 색은 화이트보드 펜 색 그대로 */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1f2b29; --muted:#5f6b69; --line:#d9dedc; --soft:#e9ecea;
  --accent:#b85440; --accent-ink:#ffffff; --brand:#2c3a38;
  --ok:#2f7d4f; --warn:#b7791f; --bad:#c0392b; --okbg:#e3f1e8; --warnbg:#fbf0dc; --badbg:#f9e3e0;
  --t-staff:#2e9a52; --t-stanchion:#d93a2f; --t-pop:#e2b007; --t-desk:#ef8a1f; --t-chair:#222222;
  --t-exhibit:#c2287a; --t-sticker:#2f6fdb; --t-caution:#14968c; --t-note:#7a8583;
  --plan-filter:none;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a19; --panel:#1c2423; --ink:#e7ecea; --muted:#9aa6a3; --line:#2f3a38; --soft:#242e2c;
  --accent:#e07a62; --accent-ink:#1a0f0b; --brand:#cfe0db;
  --ok:#6cc48d; --warn:#e3b55a; --bad:#ef7a6c; --okbg:#1d3326; --warnbg:#3a2f18; --badbg:#3d1f1b;
  --t-staff:#4fc77a; --t-stanchion:#ff6b5e; --t-pop:#f4cf3a; --t-desk:#ffa24a; --t-chair:#e7ecea;
  --t-exhibit:#f05aa8; --t-sticker:#6ea0ff; --t-caution:#3cc7bb; --t-note:#9aa6a3;
  --plan-filter:invert(.9) hue-rotate(180deg); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --panel:#1c2423; --ink:#e7ecea; --muted:#9aa6a3; --line:#2f3a38; --soft:#242e2c;
  --accent:#e07a62; --accent-ink:#1a0f0b; --brand:#cfe0db;
  --ok:#6cc48d; --warn:#e3b55a; --bad:#ef7a6c; --okbg:#1d3326; --warnbg:#3a2f18; --badbg:#3d1f1b;
  --t-staff:#4fc77a; --t-stanchion:#ff6b5e; --t-pop:#f4cf3a; --t-desk:#ffa24a; --t-chair:#e7ecea;
  --t-exhibit:#f05aa8; --t-sticker:#6ea0ff; --t-caution:#3cc7bb; --t-note:#9aa6a3;
  --plan-filter:invert(.9) hue-rotate(180deg); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{margin:2px 0 0;font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:120px}
.stat b{display:block;font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.notice{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--warnbg);color:var(--ink)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .cnt{font-family:var(--f-num);font-size:11px;margin-left:6px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 14px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--panel)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--panel);cursor:pointer;font-size:13px}
.chip[data-vis][aria-pressed="false"]{opacity:.45}
.chip.add[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.muted{color:var(--muted)}
.small{font-size:12px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* plan */
.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:900px){.plan-grid{grid-template-columns:minmax(0,1fr)}}
.plan-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.plan{position:relative;min-width:680px;aspect-ratio:1600/1075;max-width:100%;touch-action:none;user-select:none}
.plan img{position:absolute;inset:0;width:100%;height:100%;filter:var(--plan-filter);pointer-events:none}
:root[data-theme="dark"] .plan-scroll{background:#141a19}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .plan-scroll{background:#141a19}}
.plan.adding{cursor:crosshair}
.mk{position:absolute;transform:translate(-50%,-50%);min-width:24px;height:24px;padding:0 5px;border-radius:12px;border:2px solid #fff;
  color:#fff;font:600 11px/20px var(--f-num);text-align:center;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.35);white-space:nowrap}
.plan.locked .mk{cursor:pointer}
.mk.sel{outline:3px solid var(--ink);outline-offset:1px;z-index:5}
.mk.dragging{cursor:grabbing;z-index:6}
.mk.dark-text{color:#1f2b29}
.mk .lbl{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:4px;padding:0 4px;font:500 10.5px/16px var(--f-ui);pointer-events:none}
.plan.nolabels .mk .lbl{display:none}
.mk:hover .lbl{display:block!important;z-index:7}
.side{display:flex;flex-direction:column;gap:12px}
.side h3,.panel h3{margin:0 0 8px;font-size:15px}
.legend{display:flex;flex-direction:column;gap:6px}
.legend .li{display:flex;align-items:center;gap:8px;justify-content:space-between}
.legend .li>span{display:flex;align-items:center;gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);font-size:14px}
textarea{resize:vertical;min-height:60px}
/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--soft)}
td input,td select{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;width:100%;min-width:60px}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{border-color:var(--accent);background:var(--bg)}
td.r,th.r{text-align:right}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.s-need{background:var(--badbg);color:var(--bad)}
.s-mid{background:var(--warnbg);color:var(--warn)}
.s-done{background:var(--okbg);color:var(--ok)}
.days{display:flex;gap:2px}
.days button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:11px;cursor:pointer;padding:0}
.days button[aria-pressed="true"]{background:var(--soft);color:var(--muted);text-decoration:line-through}
.cov td{text-align:center;font-size:12px;white-space:nowrap}
.cov td.slot{text-align:left;font-weight:600}
.c-main{background:transparent}
.c-cover{background:var(--warnbg)}
.c-merge{background:var(--warnbg);color:var(--warn)}
.c-gap{background:var(--badbg);color:var(--bad);font-weight:700}
.c-extra{background:var(--okbg);color:var(--ok)}
.task{display:grid;grid-template-columns:24px 52px minmax(0,1fr) 140px 110px 32px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.task.sel{background:var(--warnbg)}
.pinbtn{border:1px dashed var(--line);background:none;border-radius:999px;font:600 11px/20px var(--f-num);color:var(--muted);cursor:pointer;padding:0 6px;white-space:nowrap}
.pinbtn.has{border-style:solid;border-color:var(--accent);color:var(--accent)}
.pinbtn.placing{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mapcard{margin-bottom:16px}
.mapcard .plan-scroll{max-width:1040px}
.mapcard.closed .plan-scroll,.mapcard.closed .maphint{display:none}
.mk.static{cursor:pointer}
.mk.faded{opacity:.22}
.mk.gap{box-shadow:0 0 0 3px var(--bad)}
.daypick button{min-width:34px}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:2px;padding:0}
.task.done .t-title{color:var(--muted);text-decoration:line-through}
.task input[type=text],.task input[type=date]{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;width:100%}
.task input:hover{border-color:var(--line)}
.task.overdue .t-due{color:var(--bad);font-weight:600}
@media (max-width:640px){.task{grid-template-columns:24px minmax(0,1fr) 32px}.task .pinbtn{grid-column:2;justify-self:start}.task .t-title{grid-column:2}.task .t-due,.task .t-owner{grid-column:2}}
.group-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 4px}
.group-h h4{margin:0;font-size:14px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.x:hover{color:var(--bad)}
.addform{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end;margin-top:12px}
.addform.three{grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto}
@media (max-width:720px){.addform,.addform.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:50}
@media (prefers-reduced-motion:no-preference){.mk{transition:box-shadow .15s}}
.auth{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:12px}
.auth h2{margin:0;font-size:18px}
.auth p{margin:0;color:var(--muted)}
.auth form{display:flex;gap:8px;flex-wrap:wrap}
.auth input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
/* 끌어다 놓기 · 견적서 · 후보 */
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--warnbg);color:var(--ink)}
tr.cand-row .drop{cursor:default;padding:10px}
.cand-in{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.qcard{border:1px solid var(--line);border-top:4px solid var(--qc);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--panel);min-width:0}
.qname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.qrow input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg);min-width:0;width:100%;font-size:13px}
.btn.small{padding:3px 8px;font-size:12px;white-space:nowrap}
.qsel{box-shadow:inset 4px 0 0 var(--qc)}
.thumbcell{width:56px}
.drop.thumb{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;border-radius:8px}
.drop.thumb img{width:100%;height:100%;object-fit:cover}
tr.cand-row>td{background:var(--soft);padding:10px}
tr.cand-row>td>*{position:sticky;left:10px;max-width:min(960px,calc(100vw - 96px))}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px;text-align:left}
.cand{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--panel);min-width:0}
.cand.chosen{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cand img,.cand .noimg{width:100%;aspect-ratio:1;object-fit:contain;background:var(--soft);border-radius:6px;display:flex;align-items:center;justify-content:center}
.cand .t{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.slotedit td input{min-width:90px}
.lockbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 12px;margin:12px 0 4px;font-size:13px}
.lockbar input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);min-width:0;width:150px}
.drop.sdrop{padding:4px 8px;font-size:12px;white-space:nowrap}
.task .t-sol{grid-column:3 / 6;min-height:0;field-sizing:content;border:1px dashed var(--line);border-radius:6px;padding:4px 8px;background:transparent;font-size:13px;resize:vertical}
.task .t-sol:focus{border-style:solid;border-color:var(--accent);background:var(--bg)}
@media (max-width:640px){.task .t-sol{grid-column:2}}
/* PDF 저장 (인쇄): 네 탭을 한 문서로 */
#printArea{display:none}
.p-sec h2{margin:0 0 12px;font-size:18px}
@page{size:A4 landscape;margin:10mm}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{padding:0;background:var(--panel)}
  .wrap{max-width:none}
  body.printing #view,body.printing #tabs,#notice,#who,#toast,#login,.noprint,#printArea .mapcard,#printArea .addform,#printArea .x{display:none!important}
  body.printing #printArea{display:block}
  .p-sec+.p-sec{break-before:page}
  .tbl-wrap,.plan-scroll{overflow:visible}
  tr,.task,.panel h3{break-inside:avoid}
  #printArea input,#printArea select{border:0;background:none;appearance:none;-webkit-appearance:none}
  #printArea .task{grid-template-columns:24px 52px minmax(0,1fr) 140px 110px}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">MONET 100 · 3·4층 운영 · 2026.12.3 – 2027.2.28</div>
      <h1>MONET 100 운영 보드</h1>
    </div>
    <div class="stats" id="stats"></div>
    <div class="who" id="who" hidden><span id="whoEmail"></span><button class="btn" id="pdfBtn" type="button">PDF 저장</button><button class="btn" id="logout" type="button">로그아웃</button></div>
  </header>
  <section class="panel auth" id="login" hidden>
    <h2>팀 비밀번호</h2>
    <p>운영매니저에게 받은 팀 비밀번호를 입력해 주세요. 이 기기에서는 다음부터 자동으로 들어와요.</p>
    <form id="keyForm"><input type="password" id="keyInput" required placeholder="팀 비밀번호" autocomplete="current-password"><button class="btn primary" type="submit">들어가기</button></form>
    <p id="keyMsg" role="status"></p>
    <details>
      <summary class="linkbtn">관리자 이메일 로그인</summary>
      <p>등록된 이메일로 로그인 링크를 보내드려요.</p>
      <form id="loginForm"><input type="email" id="loginEmail" required placeholder="이메일 주소" autocomplete="email"><button class="btn" type="submit">링크 받기</button></form>
      <p id="loginMsg" role="status"></p>
    </details>
  </section>
  <div class="notice" id="notice" hidden></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
  <div id="printArea"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const PLAN = {"4F":"img/4F.jpg","3F":"img/3F.jpg"};
const TYPES = {
  staff:{name:"알바생",c:"--t-staff"}, stanchion:{name:"차단봉",c:"--t-stanchion"}, pop:{name:"신세계 POP",c:"--t-pop",dark:true},
  desk:{name:"리셉션 테이블",c:"--t-desk"}, chair:{name:"의자",c:"--t-chair"}, exhibit:{name:"전시 차단봉",c:"--t-exhibit"},
  sticker:{name:"바닥 스티커",c:"--t-sticker"}, caution:{name:"주의표지판",c:"--t-caution"}, note:{name:"메모",c:"--t-note"}
};
const DAYS = ["월","화","수","목","금","토","일"];
const GROUPS = [
  {id:"rec",name:"리셉션",floor:"4층",slots:[
    {id:"rec-am",name:"① 리셉션 오전조",time:"10:30~19:30",brk:"13:30~14:30",cover:"① 오후조"},
    {id:"rec-pm",name:"① 리셉션 오후조",time:"11:30~20:30",brk:"16:30~17:30",cover:"① 오전조"}]},
  {id:"f4",name:"4층 전시·미디어",floor:"4층",slots:[
    {id:"s2",name:"② 살롱~산업혁명",time:"11:00~20:00",brk:"12:00~13:00",cover:"③ 함께 봄",merge:"s3"},
    {id:"s3",name:"③ 튜브물감~모네작품",time:"11:00~20:00",brk:"13:00~14:00",cover:"② 함께 봄",merge:"s2"},
    {id:"s4",name:"④ 미디어관",time:"11:00~20:00",brk:"14:00~15:00",cover:"운영매니저"},
    {id:"s4b",name:"④ 미디어관 2",time:"11:00~20:00",brk:"미정",cover:"④ 미디어관",merge:"s4",optional:true},
    {id:"s7",name:"4층 복도",time:"11:00~20:00",brk:"미정",cover:"운영매니저"}]},
  {id:"jg",name:"역무원·굿즈샵",floor:"3층",slots:[
    {id:"s5",name:"⑤ 역무원",time:"11:00~20:00",brk:"12:30~13:30",cover:"⑥ 오전조"},
    {id:"s8",name:"⑧ 굿즈샵",time:"11:00~20:00",brk:"15:00~16:00",cover:"운영매니저 / 주말 지원"},

  const ppl=alba().slice().sort((a,b)=>(a.order||0)-(b.order||0)), used=new Set();

  const take=f=>{const p=ppl.find(x=>!used.has(x.id)&&f(x)); if(p) used.add(p.id); return p;};

function dropZone(el,{onFiles,onText,accept}){
  if(!el) return;
  el.addEventListener("dragover",e=>{e.preventDefault();el.classList.add("over");});

    const t=(e.dataTransfer.getData("text/uri-list")||e.dataTransfer.getData("text/plain")||"").split("\n")[0].trim();
    if(t&&onText) onText(t); });
  if(onFiles) el.addEventListener("click",e=>{ if(e.target.closest("input,button,a")) return;
    const inp=document.createElement("input"); inp.type="file"; inp.multiple=true; if(accept) inp.accept=accept;
    inp.onchange=()=>inp.files.length&&onFiles([...inp.files]); inp.click(); });

const readURL=b=>new Promise((ok,no)=>{const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=no; r.readAsDataURL(b);});
function shrinkImage(file,max,q){ // 사진을 줄여 JPEG로
  return new Promise((ok,no)=>{const img=new Image(); img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src); c.toBlob(b=>b?ok(b):no(new Error("이미지")),"image/jpeg",q);};
    img.onerror=no; img.src=URL.createObjectURL(file);});
}
async function storeFile(file){

  const id=uid("f"), meta={name:file.name,type:blob.type||file.type,size:blob.size}, b64=await readURL(blob);

const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", PDFJS_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const TESS="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js";
const scripts={};
const loadScript=src=>scripts[src]||(scripts[src]=new Promise((ok,no)=>{const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>{delete scripts[src];no(new Error(src));}; document.head.appendChild(s);}));
async function ocr(img){ await loadScript(TESS); const r=await Tesseract.recognize(img,"kor+eng"); return r.data.text||""; }
async function extractText(file){
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
    await loadScript(PDFJS); pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; let out="";
    for(let i=1;i<=Math.min(pdf.numPages,4);i++){
      const tc=await (await pdf.getPage(i)).getTextContent(); let lastY=null;
      tc.items.forEach(it=>{const y=it.transform[5]; out+=(lastY!==null&&Math.abs(y-lastY)>4)?"\n":" "; out+=it.str; lastY=y;}); out+="\n"; }
    if(out.replace(/\s/g,"").length>40) return out;
    const pg=await pdf.getPage(1), vp=pg.getViewport({scale:2}), c=document.createElement("canvas"); // 스캔한 PDF
    c.width=vp.width; c.height=vp.height; await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    return ocr(c);
  }
  return ocr(file);
}

  const squash=s=>s.replace(/^((?:[가-힣] )+[가-힣])$/,m=>m.replace(/ /g,"")).trim();
  const r={};
  const biz=t.match(/(?<![\d-])(\d{3})\s*-\s*(\d{2})\s*-\s*(\d{5})(?![\d-])/); if(biz) r.bizno=`${biz[1]}-${biz[2]}-${biz[3]}`;
  const em=t.match(/[\w.+-]+@[\w-]+\.[\w.-]+/); if(em) r.email=em[0];
  const dt=t.match(/(20\d{2})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/); if(dt) r.date=`${dt[1]}-${dt[2].padStart(2,"0")}-${dt[3].padStart(2,"0")}`;
  // 연락처: 전화/연락처/담당 표시가 붙은 번호 > 휴대폰 > 첫 번호 (팩스 제외)
  const phones=[]; const pre=new RegExp("(?:\\+82[-\\s]?)?(0\\d{1,2})[)\\-.\\s]{0,2}(\\d{3,4})[-.\\s]{0,2}(\\d{4})(?!\\d)","g"); let m;
  while((m=pre.exec(t))){ const before=t.slice(Math.max(0,m.index-14),m.index);
    if(/fax|팩\s*스|F\s*[.:]?\s*$/i.test(before)) continue;
    phones.push({v:`${m[1]}-${m[2]}-${m[3]}`,s:(/(전\s*화|연\s*락|담\s*당|휴\s*대|tel|hp|h\.p|mobile|☎)/i.test(before)?2:0)+(m[1]==="010"?1:0)}); }
  if(phones.length) r.phone=phones.sort((a,b)=>b.s-a.s)[0].v;
  // 계좌: 은행 이름이나 '계좌/입금'이 있는 줄의 긴 숫자
  const bankRe=new RegExp(BANKS);
  for(let i=0;i<lines.length&&!r.account;i++){ const ln=lines[i]+" "+(lines[i+1]||"");
    if(!(bankRe.test(lines[i])||/(계\s*좌|입\s*금|예\s*금\s*주|bank)/i.test(lines[i]))) continue;
    const nums=ln.match(/\d[\d\s-]{8,22}\d/g)||[];
    const acc=nums.map(s=>s.trim()).find(s=>{const d=s.replace(/\D/g,""); return d.length>=10&&d.length<=16&&!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(s)&&!/^\d{3}-\d{2}-\d{5}$/.test(s);});
    if(acc){ r.account=acc.replace(/\s+/g,"-").replace(/-+/g,"-"); const b=ln.match(bankRe); if(b) r.bank=b[0];
      const h=ln.match(new RegExp(L("예금주")+"\\s*[:：]?\\s*([^\\s,/|]+(?:\\s?\\([^)]*\\))?)")); if(h) r.holder=h[1]; } }
  // 회사명: 상호 / 업체명 / 회사명 / 공급자 → (주)○○ 형태
  const cut=s=>squash(s.split(new RegExp("\\s(?:"+["성명","대표","사업","등록","전화","주소","업태","종목"].map(L).join("|")+")"))[0].replace(/^[:：\s]+|[\s|,]+$/g,"")).slice(0,30);
  for(const re of [new RegExp(L("상호")+"(?:\\s*\\(\\s*"+L("법인명")+"\\s*\\))?\\s*[:：]?\\s*(.+)"), new RegExp("(?:"+["업체명","회사명","공급자"].map(L).join("|")+")\\s*[:：]?\\s*(.+)")]){
    for(const ln of lines){ const x=ln.match(re); if(x){ const v=cut(x[1]); if(v.length>=2&&!/(귀\s*하|귀\s*중)$/.test(v)){ r.vendor=v; break; } } } if(r.vendor) break; }
  if(!r.vendor){ const x=t.match(/((?:\(주\)|㈜|주식회사)\s*[가-힣A-Za-z0-9&]{2,20}|[가-힣A-Za-z0-9&]{2,20}\s*(?:\(주\)|㈜))/); if(x) r.vendor=x[1].trim(); }
  // 금액: 합계·총액 줄의 가장 큰 숫자 → 없으면 문서의 가장 큰 금액
  const money=s=>(s.match(/\d{1,3}(?:,\d{3})+|\d{4,}/g)||[]).map(x=>+x.replace(/,/g,"")).filter(n=>n>=100&&n<1e10);
  const label=new RegExp("(?:"+["합계","총액","총금액","견적금액","일금","청구금액"].map(L).join("|")+"|total|₩)","i");
  let best=0; lines.forEach((ln,i)=>{ if(label.test(ln)) money(ln+" "+(/\d/.test(ln)?"":(lines[i+1]||""))).forEach(n=>{ if(n>best) best=n; }); });
  if(!best){ const all=(t.match(/\d{1,3}(?:,\d{3})+/g)||[]).map(x=>+x.replace(/,/g,"")); if(all.length) best=Math.max(...all); }
  if(best) r.amount=String(best);
  return r;
}

/* ---------- 상품 링크 → 사진 · 가격 (r.jina.ai 읽기 서비스 사용) ---------- */
async function fetchPreview(url){
  const res=await fetch("https://r.jina.ai/"+url,{headers:{"X-Return-Format":"html"}});
  if(!res.ok) throw new Error("preview "+res.status);
  const doc=new DOMParser().parseFromString(await res.text(),"text/html");
  const meta=(...ns)=>{for(const n of ns){const el=doc.querySelector(`meta[property="${n}"],meta[name="${n}"],meta[itemprop="${n}"]`); if(el&&el.getAttribute("content")) return el.getAttribute("content").trim();} return "";};
  let price=meta("product:price:amount","og:price:amount","price");
  if(!price){ const find=o=>{ if(!o||typeof o!=="object") return ""; if(o.offers){const of=[].concat(o.offers)[0]; if(of&&(of.price||of.lowPrice)) return of.price||of.lowPrice;}
      for(const v of Object.values(o)){const x=find(v); if(x) return x;} return ""; };
    for(const s of doc.querySelectorAll('script[type="application/ld+json"]')){ try{ price=find(JSON.parse(s.textContent)); }catch(e){} if(price) break; } }
  if(!price){ const el=doc.querySelector('[itemprop="price"]'); if(el) price=el.getAttribute("content")||el.textContent; }
  if(!price){ const x=(doc.body?doc.body.textContent:"").match(/(\d{1,3}(?:,\d{3})+)\s*원/); if(x) price=x[1]; }
  price=String(price||"").replace(/[^\d.]/g,""); price=price?String(Math.round(parseFloat(price))):"";
  let image=meta("og:image","og:image:url","twitter:image"); if(image){ try{image=new URL(image,url).href;}catch(e){image="";} }
  return {title:(meta("og:title","twitter:title")||doc.title||"").slice(0,120),image,price,site:meta("og:site_name")||new URL(url).hostname.replace(/^www\./,"")};
}

/* ---------- 잠금: 신분증·통장 사진 (잠금 비밀번호로 암호화해서 저장 · 팀 비밀번호만으론 못 봄) ---------- */
const LOCK_ID="cfg-lock", LOCK_ITER=200000, LOCK_IDLE=10*60*1000;
const unlocked=()=>!!ui.unlockKey;
const lockCfg=()=>state.settings.find(x=>x.id===LOCK_ID);
const b64e=buf=>{const a=new Uint8Array(buf); let s=""; for(let i=0;i<a.length;i+=8192) s+=String.fromCharCode.apply(null,a.subarray(i,i+8192)); return btoa(s);};
const b64d=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function lockKey(pw,salt){ const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:LOCK_ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]); }
async function seal(key,bytes){ const iv=crypto.getRandomValues(new Uint8Array(12)); return {iv:b64e(iv),ct:b64e(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,bytes))}; }
const unseal=(key,iv,ct)=>crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(iv)},key,b64d(ct));
let idleTimer=null;
function setUnlocked(key){ ui.unlockKey=key; clearTimeout(idleTimer); if(key) idleTimer=setTimeout(()=>{ui.unlockKey=null;toast("10분이 지나 다시 잠갔어요");render();},LOCK_IDLE); render(); }
async function unlockWith(pw){
  const c=lockCfg(); if(!c) return false;
  const key=await lockKey(pw,b64d(c.salt));
  try{ await unseal(key,c.check.iv,c.check.ct); setUnlocked(key); return true; }catch(e){ return false; }
}
async function createLock(pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)), key=await lockKey(pw,salt);
  save("settings",{id:LOCK_ID,salt:b64e(salt),check:await seal(key,new TextEncoder().encode("monet-ok"))}); setUnlocked(key);
}
async function storeSecret(file){
  if(!unlocked()) return null;
  let blob=file; if(/^image\//.test(file.type)) blob=await shrinkImage(file,1600,.85);
  if(blob.size>MAX_FILE){ toast("파일이 너무 커요. 4MB까지 올릴 수 있어요."); return null; }
  const {iv,ct}=await seal(ui.unlockKey,await blob.arrayBuffer());
  const id=uid("f"), meta={name:"locked",type:blob.type||"application/octet-stream",size:blob.size,enc:true,iv}; // 파일 이름은 남기지 않아요
  state.files.push({id,...meta});
  if(!db){ localFiles[id]=ct; return id; }
  const {error}=await db.from(TABLE).upsert({col:"items",id,data:{meta,b64:ct},updated_at:new Date().toISOString()});
  if(error){ handleErr(error); return null; }
  return id;
}
async function openSecret(id){
  const meta=state.files.find(f=>f.id===id); if(!meta||!unlocked()){ toast("파일을 찾지 못했어요."); return; }
  const w=window.open("","_blank");

  try{ const buf=await unseal(ui.unlockKey,meta.iv,ct); const u=URL.createObjectURL(new Blob([buf],{type:meta.type}));
    if(w) w.location=u; else location.href=u; }
  catch(e){ if(w) w.close(); toast("파일을 열지 못했어요."); }
}

/* ---------- coverage ---------- */
function coverage(){
  // returns {slotId:[{who, kind}] x7}, extras per day
  const staff=state.staff, on=(p,d)=>!(p.off||[]).includes(d);
  const res={}; const extra=DAYS.map(()=>[]);
  GROUPS.forEach(g=>g.slots.forEach(s=>res[s.id]=DAYS.map(()=>null)));
  DAYS.forEach((_,d)=>{
    const used=new Set();
    GROUPS.forEach(g=>{
      const mains=staff.filter(p=>p.kind==="담당"&&SLOT[p.slot]&&SLOT[p.slot].group===g.id);
      const fl=FLOATS.find(f=>f.floor===g.floor);
      const covers=staff.filter(p=>p.kind==="대타"&&(p.group===g.id||(fl&&p.group===fl.id)))
        .sort((a,b)=>(a.group===g.id?0:1)-(b.group===g.id?0:1)||(a.order||0)-(b.order||0)); // 구역 대타 먼저, 다음 층 로테이션
      const holes=[];
      g.slots.forEach(s=>{
        const m=mains.find(p=>p.slot===s.id && on(p,d));
        if(m) res[s.id][d]={who:m,kind:"main"}; else holes.push(s);
      });
      holes.sort((a,b)=>(a.optional?1:0)-(b.optional?1:0)); // 꼭 필요한 자리부터
      holes.forEach(s=>{
        const c=covers.find(p=>on(p,d)&&!used.has(p.id));
        if(c){used.add(c.id);res[s.id][d]={who:c,kind:"cover"};}
      });
      holes.forEach(s=>{
        if(res[s.id][d]) return;
        if(s.merge && res[s.merge][d] && res[s.merge][d].who) res[s.id][d]={who:null,kind:"merge",text:SLOT[s.merge].name.slice(0,1)+" 함께"};
        else res[s.id][d]={who:null,kind:"gap"};
      });
    });
    // 같은 층에 빈자리가 있으면 두 번째 자리(미디어관 2·굿즈샵 2) 사람이 그리로 옮겨요
    ["4층","3층"].forEach(f=>{ const sl=floorSlots(f);
      sl.filter(s=>!s.optional&&res[s.id][d].kind==="gap").forEach(gs=>{
        const os=sl.find(s=>s.optional&&res[s.id][d].who); if(!os) return;
        res[gs.id][d]={who:res[os.id][d].who,kind:"cover",moved:true};
        res[os.id][d]={who:null,kind:"merge",text:SLOT[os.merge].name.slice(0,1)+" 함께"}; }); });
    staff.filter(p=>p.kind==="대타"&&on(p,d)&&!used.has(p.id)).forEach(p=>extra[d].push(p));
  });
  return {res,extra};
}

function bindPlan(){
  document.querySelectorAll("[data-floor]").forEach(b=>b.onclick=()=>{ui.floor=b.dataset.floor;ui.sel=null;try{localStorage.setItem("mb-floor",ui.floor)}catch(e){};render();});
  document.querySelectorAll("[data-vis]").forEach(b=>b.onclick=()=>{const k=b.dataset.vis;ui.hidden.has(k)?ui.hidden.delete(k):ui.hidden.add(k);render();});
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{ui.addType=ui.addType===b.dataset.add?null:b.dataset.add;render();});
  $("#lblToggle").onchange=e=>{ui.labels=e.target.checked;render();};
  $("#planEditBtn").onclick=()=>{ui.planEdit=!ui.planEdit; ui.addType=null; ui.confirmDel=null; if(!ui.planEdit) toast("위치를 잠갔어요"); render();};
  const plan=$("#plan");
  plan.addEventListener("pointerdown",e=>{
    const mk=e.target.closest(".mk"); const r=plan.getBoundingClientRect();
    if(!mk){
      if(!ui.planEdit||!ui.addType){ if(ui.sel){ui.sel=null;render();} return; }
      const x=+((e.clientX-r.left)/r.width*100).toFixed(2), y=+((e.clientY-r.top)/r.height*100).toFixed(2);
      const m={id:uid("m"),floor:ui.floor,type:ui.addType,x,y,label:TYPES[ui.addType].name,qty:1,note:""};
      if(ui.addType==="sticker") m.glyph="→";
      ui.sel=m.id; save("markers",m); return;
    }
    const m=state.markers.find(z=>z.id===mk.dataset.id); if(!m) return;
    if(!ui.planEdit){ ui.sel=ui.sel===m.id?null:m.id; ui.confirmDel=null; render(); return; } // 잠금 중엔 누르기만 (못 옮김)
    e.preventDefault(); mk.setPointerCapture(e.pointerId);
    const sx=e.clientX, sy=e.clientY; let moved=false, nx=m.x, ny=m.y;
    const mv=ev=>{ if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>4) moved=true; if(!moved) return;
      mk.classList.add("dragging");
      nx=Math.min(99,Math.max(1,(ev.clientX-r.left)/r.width*100)); ny=Math.min(99,Math.max(1,(ev.clientY-r.top)/r.height*100));
      mk.style.left=nx+"%"; mk.style.top=ny+"%"; };
    const up=()=>{ mk.removeEventListener("pointermove",mv); mk.removeEventListener("pointerup",up); mk.removeEventListener("pointercancel",up);
      if(moved){ save("markers",{...m,x:+nx.toFixed(2),y:+ny.toFixed(2)}); }
      else { ui.sel = ui.sel===m.id?null:m.id; ui.confirmDel=null; render(); } };
    mk.addEventListener("pointermove",mv); mk.addEventListener("pointerup",up); mk.addEventListener("pointercancel",up);
  });
  const sel=state.markers.find(m=>m.id===ui.sel); if(!sel) return;
  const upd=patch=>save("markers",{...state.markers.find(m=>m.id===ui.sel),...patch});
  $("#e-type").onchange=e=>upd({type:e.target.value});
  $("#e-label").onchange=e=>upd({label:e.target.value.trim()});
  $("#e-qty").onchange=e=>upd({qty:Math.max(1,parseInt(e.target.value)||1)});
  $("#e-note").onchange=e=>upd({note:e.target.value});
  if($("#e-glyph")) $("#e-glyph").onchange=e=>upd({glyph:e.target.value});
  $("#e-close").onclick=()=>{ui.sel=null;render();};
  if($("#e-del")) $("#e-del").onclick=()=>{ if(ui.confirmDel===sel.id){ui.confirmDel=null;ui.sel=null;remove("markers",sel.id);} else {ui.confirmDel=sel.id;render();} };
}

async function addCand(itemId,raw){

  const it=curItem(itemId); if(!it) return;
  const c={id:uid("c"),url,title:"",image:"",price:"",site:host,loading:true};
  save("items",{...it,cands:[...(it.cands||[]),c]});
  try{ const p=await fetchPreview(url); updCand(itemId,c.id,{...p,price:p.price,loading:false},true);
    if(!p.price) toast("가격을 못 읽었어요. 가격 칸에 직접 적어 주세요."); }
  catch(e){ console.error(e); updCand(itemId,c.id,{loading:false,title:url},true); toast("이 링크는 정보를 못 불러왔어요. 가격을 직접 적어 주세요."); }
}
async function addQuoteFiles(files){
  for(const file of files){
    const q={id:uid("q"),fileName:file.name,color:state.quotes.length%LABEL_C.length,scan:"읽는 중…"};
    save("quotes",q); toast("견적서를 읽는 중이에요…");
    const fid=await storeFile(file);
    if(!fid){ remove("quotes",q.id); continue; }
    let p={}, scan="못 읽음 · 직접 입력해 주세요";
    try{ p=parseQuote(await extractText(file)); if(Object.keys(p).length) scan="자동 입력됨 · 확인해 주세요"; }catch(e){ console.error(e); }
    const cur=state.quotes.find(x=>x.id===q.id)||q; const fill={};
    Object.entries(p).forEach(([k,v])=>{ if(!cur[k]) fill[k]=v; }); // 그 사이 직접 적은 칸은 그대로
    save("quotes",{...cur,...fill,fileId:fid,scan},true);
  }
}

  const num={}; located.forEach((t,i)=>num[t.id]=i+1);
  const pins=located.filter(t=>t.floor===ui.floor).map(t=>({id:t.id,x:t.x,y:t.y,color:t.done?"var(--t-note)":"var(--accent)",text:num[t.id],
    label:`${t.title.length>18?t.title.slice(0,18)+"…":t.title}`,sel:ui.taskSel===t.id,faded:t.done&&ui.taskFilter==="open"}));
  const placing=state.tasks.find(t=>t.id===ui.placingTask);
  const hint=placing?`<b>${esc(placing.title)}</b>: 도면에서 위치를 누르세요. <button class="linkbtn" id="cancelPlace">취소</button>`
    :"할 일 옆 '위치'를 누른 뒤 도면을 누르면 그 자리에 번호가 찍혀요. 번호를 누르면 해당 할 일로 이동해요.";
  const ctx=state.markers.filter(m=>m.floor===ui.floor).map(m=>({id:"ctx-"+m.id,x:m.x,y:m.y,color:tcolor(m.type),text:"",label:m.label,faded:true,ctx:true}));
  const map=mapCard("할 일 위치","",ctx.concat(pins),hint,!!placing);
  const list = state.tasks.length ? (groups.length? groups.map(([c,a])=>`<div class="group-h"><h4>${c}</h4><span class="small muted">${a.length}</span></div>
    ${a.map(t=>`<div class="task ${t.done?"done":""} ${!t.done&&t.due&&t.due<today?"overdue":""} ${ui.taskSel===t.id?"sel":""}" data-id="${t.id}" id="task-${t.id}">
      <input type="checkbox" data-f="done" ${t.done?"checked":""} aria-label="완료">
      <button class="pinbtn ${num[t.id]?"has":""} ${ui.placingTask===t.id?"placing":""}" data-place title="${num[t.id]?(t.floor==="4F"?"4층":"3층")+" 위치 · 다시 누르면 위치 변경":"도면에 위치 표시"}">${num[t.id]?(t.floor==="4F"?"4F":"3F")+" #"+num[t.id]:"위치"}</button>
      <input type="text" class="t-title" data-f="title" value="${esc(t.title)}">
      <input type="date" class="t-due" data-f="due" value="${esc(t.due||"")}" aria-label="마감일">
      <input type="text" class="t-owner" data-f="owner" value="${esc(t.owner||"")}" placeholder="담당">
      <button class="x" data-del aria-label="삭제">${ui.confirmDel===t.id?"삭제?":"×"}</button>
      <textarea class="t-sol" data-f="solution" rows="1" placeholder="어떻게 해결했는지 적어 주세요">${esc(t.solution||"")}</textarea></div>`).join("")}`).join("") : `<div class="empty">${ui.taskFilter==="done"?"아직 끝낸 일이 없어요.":"남은 할 일이 없어요."}</div>`)
    : loadingOrEmpty("tasks","아직 등록한 할 일이 없어요. 아래에서 추가해 보세요.");
  return `${map}<div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0">할 일</h3>
    <div class="seg" role="group" aria-label="보기">${[["open","남은 일"],["all","전체"],["done","완료"]].map(([k,n])=>`<button data-tf="${k}" aria-pressed="${ui.taskFilter===k}">${n}</button>`).join("")}</div></div>
    ${list}
    <form class="addform" id="addTask"><label class="f">할 일<input id="nt-title" required placeholder="예: 무전기 대여 업체 견적"></label>
      <label class="f">분류<select id="nt-cat">${TASK_CATS.map(c=>`<option>${c}</option>`).join("")}</select></label>
      <label class="f">마감일<input id="nt-due" type="date"></label>
      <label class="f">담당<input id="nt-owner"></label>
      <button class="btn primary" type="submit">추가</button></form></div>`;
}
function bindTasks(){
  bindMapCard(id=>{
    if(id.startsWith("ctx-")) return;
    ui.taskSel=id; const t=state.tasks.find(x=>x.id===id);
    if(t&&t.done&&ui.taskFilter==="open") ui.taskFilter="all";
    render(); const el=document.getElementById("task-"+id); if(el) el.scrollIntoView({block:"center"});
  },(x,y)=>{
    if(!ui.placingTask) return; const t=state.tasks.find(z=>z.id===ui.placingTask); ui.placingTask=null;
    if(t){ui.taskSel=t.id; save("tasks",{...t,floor:ui.floor,x,y}); toast("위치를 표시했어요");}
  });
  const cp=$("#cancelPlace"); if(cp) cp.onclick=()=>{ui.placingTask=null;render();};
  document.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>{ui.taskFilter=b.dataset.tf;render();});
  document.querySelectorAll(".task[data-id]").forEach(row=>{
    const t=()=>state.tasks.find(x=>x.id===row.dataset.id);
    row.querySelectorAll("[data-f]").forEach(el=>el.onchange=()=>save("tasks",{...t(),[el.dataset.f]:el.type==="checkbox"?el.checked:el.value.trim()}));
    row.querySelector("[data-del]").onclick=()=>{ if(ui.confirmDel===t().id){ui.confirmDel=null;remove("tasks",t().id);} else {ui.confirmDel=t().id;render();} };
    row.querySelector("[data-place]").onclick=()=>{ const cur=t();
      if(ui.placingTask===cur.id){ui.placingTask=null;render();return;}
      if(cur.floor&&cur.floor!==ui.floor) ui.floor=cur.floor;
      ui.placingTask=cur.id; ui.taskSel=cur.id; ui.mapOpen=true; render();
      const mc=document.querySelector(".mapcard"); if(mc) mc.scrollIntoView({block:"start"}); };
  });
  $("#addTask").onsubmit=e=>{e.preventDefault(); const n=$("#nt-title").value.trim(); if(!n) return;
    save("tasks",{id:uid("t"),title:n,cat:$("#nt-cat").value,due:$("#nt-due").value,owner:$("#nt-owner").value.trim(),done:false}); toast("추가했어요");};
}
</script>
