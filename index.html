  M.days.forEach((d,i)=>{ const w=dowOf(d), c=i+2;
    html+=`<div class="gh ${w>=5?"we":""} ${d===M.today?"today":""}" style="grid-row:1;grid-column:${c}">${md(d)}<span class="wk">${DAYS[w]}</span></div>`;
    html+=`<div class="gcol ${w>=5?"we":""} ${d===M.today?"today":""}" style="grid-row:2/${R0+lanes.length};grid-column:${c}"></div>`; });
  html+=`<div class="gnl" style="grid-row:1;grid-column:1;z-index:4">구분</div><div class="gnl" style="grid-row:2;grid-column:1"><b>일정</b></div><div class="glane" style="grid-row:2;grid-column:2/${N+2}"></div>`;
  M.ms.forEach(x=>{ const i=idx(x.date); if(i>=0) html+=`<div class="gms" style="grid-row:2;grid-column:${i+2}">◆ ${esc(x.label||"")}</div>`; });
  lanes.forEach((ln,k)=>{ const r=R0+k;
    if(ln.lead) html+=`<div class="gnl ${ln.first?"vfirst":""}" style="--c:${M.color(ln.v)};grid-row:${r}/span ${ln.span};grid-column:1">${ln.first?`<span class="vtag">${esc(ln.v)}</span>`:""}<span class="sh">${ln.sh}</span></div>`;
    html+=`<div class="glane ${ln.first?"vfirst":""}" style="grid-row:${r};grid-column:2/${N+2}"></div>`;
    ln.items.forEach(b=>{ const a=Math.max(0,idx(sStart(b))), e=idx(sEnd(b))<0?N-1:idx(sEnd(b));
      html+=`<button class="gbar" data-gb="${b.id}" aria-pressed="${ui.schedSel===b.id}" style="--c:${M.color(b.vendor)};grid-row:${r};grid-column:${a+2}/${e+3}" title="${esc(b.label||"")}">${esc(b.label||"")}</button>`; });
  });
  const sel=bars.find(b=>b.id===ui.schedSel);
  const det=sel?`<div class="sdetail" ${vstyle(M,sel.vendor)}><div class="grow"><span class="vtag">${esc(sel.vendor||"")}</span> <span class="small muted">${esc(sel.shift||"주간")}</span><br><b>${esc(sel.label||"")}</b><br><span class="small">${md(sStart(sel))}(${DAYS[dowOf(sStart(sel))]})${sEnd(sel)!==sStart(sel)?` ~ ${md(sEnd(sel))}(${DAYS[dowOf(sEnd(sel))]}) · ${dayDiff(sStart(sel),sEnd(sel))+1}일`:" · 하루"}</span></div><button class="x" data-gbx aria-label="닫기">×</button></div>`
    :`<p class="small muted" style="margin:8px 0 0">막대를 누르면 내용이 크게 보여요. 옆으로 밀어서 날짜를 넘겨 보세요.</p>`;
  return `<div class="gwrap" id="gwrap"><div class="gantt" style="grid-template-columns:${labW}px repeat(${N},${colW}px);grid-template-rows:auto auto repeat(${lanes.length},minmax(46px,auto))">${html}</div></div>${det}`;
}
function schedEditHTML(M){
  const row=x=>x.kind==="milestone"
    ?`<tr data-sid="${x.id}"><td colspan="2">◆ 일정</td><td><input type="date" data-sf="date" value="${esc(x.date||"")}"></td><td></td><td><input data-sf="label" value="${esc(x.label||"")}"></td><td><button class="x" data-sdel>×</button></td></tr>`
    :`<tr data-sid="${x.id}"><td><input data-sf="vendor" value="${esc(x.vendor||"")}" list="vendorList" style="width:110px"></td><td><select data-sf="shift">${SHIFTS.map(s=>`<option ${(x.shift||"주간")===s?"selected":""}>${s}</option>`).join("")}</select></td>
      <td><input type="date" data-sf="start" value="${esc(x.start||"")}"></td><td><input type="date" data-sf="end" value="${esc(x.end||"")}"></td><td><input data-sf="label" value="${esc(x.label||"")}" placeholder="작업 내용" style="min-width:220px"></td><td><button class="x" data-sdel>×</button></td></tr>`;
  const thead=`<thead><tr><th>업체</th><th>주간/야간</th><th>시작</th><th>끝</th><th>내용</th><th></th></tr></thead>`;
  const byS=(a,b)=>sStart(a).localeCompare(sStart(b));
  const groups=[["◆ 주요 일정 (마일스톤)",M.ms.slice().sort(byS)],...M.vendors.map(v=>[v,M.bars.filter(b=>b.vendor===v).sort(byS)]),["업체 없음",M.bars.filter(b=>!b.vendor).sort(byS)]].filter(g=>g[1].length);
  return `<details class="panel sedit" style="margin-top:16px" ${ui.schedEdit?"open":""}><summary>일정 고치기 · 추가 <span class="small muted">${state.sched.length}개</span></summary>
    ${groups.map(([n,L])=>`<div class="vgrp"><h4>${M.vendors.includes(n)?`<span class="vtag" ${vstyle(M,n)}>${esc(n)}</span>`:esc(n)} <span class="small muted">${L.length}</span></h4>
      ${M.vendors.includes(n)?`<label class="small muted">메모 <input data-vnote="${esc(n)}" value="${esc(M.notes[n]||"")}" placeholder="예: 3F만 작업" style="width:min(320px,100%)"></label>`:""}
      <div class="tbl-wrap"><table>${thead}<tbody>${L.map(row).join("")}</tbody></table></div></div>`).join("")}
    <datalist id="vendorList">${M.vendors.map(v=>`<option value="${esc(v)}">`).join("")}</datalist>
    <h4 style="margin:18px 0 6px">새 일정 넣기</h4>
    <form class="addform six" id="addSched"><label class="f">업체<input id="ns-vendor" list="vendorList" placeholder="예: 큐비크스" required></label>
      <label class="f">주간/야간<select id="ns-shift">${SHIFTS.map(s=>`<option>${s}</option>`).join("")}</select></label>
      <label class="f">시작<input type="date" id="ns-start" required></label><label class="f">끝<input type="date" id="ns-end"></label>
      <label class="f">내용<input id="ns-label" placeholder="예: 가벽 설치"></label><button class="btn primary" type="submit">추가</button></form>
    <form class="addform three" id="addMile" style="margin-top:8px"><label class="f">주요 일정<input id="nm-label" placeholder="예: 오픈" required></label>
      <label class="f">날짜<input type="date" id="nm-date" required></label><button class="btn" type="submit">주요 일정 추가</button></form></details>`;
}
function bindSched(){
  const keep=()=>{ try{ localStorage.setItem("mb-schedview",ui.schedView); localStorage.setItem("mb-schedhide",JSON.stringify([...ui.schedHide])); }catch(e){} };
  document.querySelectorAll("[data-sview]").forEach(b=>b.onclick=()=>{ ui.schedView=b.dataset.sview; keep(); render(); });
  document.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>{ const v=b.dataset.sv; ui.schedHide.has(v)?ui.schedHide.delete(v):ui.schedHide.add(v); keep(); render(); });
  document.querySelectorAll("[data-gb]").forEach(b=>b.onclick=()=>{ ui.schedSel=ui.schedSel===b.dataset.gb?null:b.dataset.gb; const g=$("#gwrap"), sl=g&&g.scrollLeft; render(); const g2=$("#gwrap"); if(g2) g2.scrollLeft=sl; });
  const bx=$("[data-gbx]"); if(bx) bx.onclick=()=>{ ui.schedSel=null; const g=$("#gwrap"), sl=g&&g.scrollLeft; render(); const g2=$("#gwrap"); if(g2) g2.scrollLeft=sl; };
  const det=$("details.sedit"); if(det) det.ontoggle=()=>{ ui.schedEdit=det.open; };
  document.querySelectorAll("tr[data-sid]").forEach(tr=>{ const x=()=>state.sched.find(s=>s.id===tr.dataset.sid);
    tr.querySelectorAll("[data-sf]").forEach(el=>el.onchange=()=>save("sched",{...x(),[el.dataset.sf]:el.value.trim()}));
    tr.querySelector("[data-sdel]").onclick=()=>{ if(ui.confirmDel===x().id){ ui.confirmDel=null; remove("sched",x().id); } else { ui.confirmDel=x().id; toast("한 번 더 누르면 지워져요"); } }; });
  document.querySelectorAll("[data-vnote]").forEach(el=>el.onchange=()=>{ const cfg=state.settings.find(x=>x.id==="cfg-sched")||{id:"cfg-sched"}; save("settings",{...cfg,notes:{...(cfg.notes||{}),[el.dataset.vnote]:el.value.trim()}}); });
  $("#addSched").onsubmit=e=>{e.preventDefault(); const start=$("#ns-start").value;
    save("sched",{id:uid("s"),kind:"bar",vendor:$("#ns-vendor").value.trim(),shift:$("#ns-shift").value,start,end:$("#ns-end").value||start,label:$("#ns-label").value.trim()}); toast("추가했어요");};
  $("#addMile").onsubmit=e=>{e.preventDefault(); save("sched",{id:uid("s"),kind:"milestone",date:$("#nm-date").value,label:$("#nm-label").value.trim()}); toast("추가했어요");};
  // 공정표: 오늘이 기간 안이면 오늘 쪽으로 밀어 둬요
  const g=$("#gwrap"), t=g&&g.querySelector(".gh.today"); if(g&&t&&!g.dataset.done&&!ui.schedSel){ g.scrollLeft=Math.max(0,t.offsetLeft-160); }
}
// 한 번만: 받은 공정표(11/9~12/3, 큐비크스·NGD, 11/9 제작물 발주)를 넣어 둬요
function seedSched(){
  if(!loaded.settings||state.settings.some(x=>x.id==="cfg-sched")) return;
  save("settings",{id:"cfg-sched",from:SCHED_FROM,to:SCHED_TO,vendors:["큐비크스","NGD"]},true);
  if(!state.sched.length) save("sched",{id:"s-seed-1",kind:"milestone",date:"2026-11-09",label:"제작물 발주"},true);
}

/* ----- tasks ----- */
function tasksHTML(){
  const today=new Date().toISOString().slice(0,10);
  let ts=state.tasks.slice();
  if(ui.taskFilter==="open") ts=ts.filter(t=>!t.done); else if(ui.taskFilter==="done") ts=ts.filter(t=>t.done);
  ts.sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
  const groups=TASK_CATS.map(c=>[c,ts.filter(t=>(t.cat||"현장 세팅")===c)]).filter(([,a])=>a.length);
  const located=state.tasks.filter(t=>t.floor&&t.x!=null).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999")||a.id.localeCompare(b.id));
  const num={}; located.forEach((t,i)=>num[t.id]=i+1);
  const pins=located.filter(t=>t.floor===ui.floor).map(t=>({id:t.id,x:t.x,y:t.y,color:t.done?"var(--t-note)":"var(--accent)",text:num[t.id],
    label:`${t.title.length>18?t.title.slice(0,18)+"…":t.title}`,sel:ui.taskSel===t.id,faded:t.done&&ui.taskFilter==="open"}));
  const placing=state.tasks.find(t=>t.id===ui.placingTask);
  const hint=placing?`<b>${esc(placing.title)}</b>: 도면에서 위치를 누르세요. <button class="linkbtn" id="cancelPlace">취소</button>`
    :"할 일 옆 '위치'를 누른 뒤 도면을 누르면 그 자리에 번호가 찍혀요. 번호를 누르면 해당 할 일로 이동해요.";
  const ctx=opMarkers().filter(m=>m.floor===ui.floor).map(m=>({id:"ctx-"+m.id,x:m.x,y:m.y,color:tcolor(m.type),text:"",label:m.label,faded:true,ctx:true}));
  const map=mapCard("할 일 위치","",ctx.concat(pins),hint,!!placing);
  const list = state.tasks.length ? (groups.length? groups.map(([c,a])=>`<div class="group-h"><h4>${c}</h4><span class="small muted">${a.length}</span></div>
    ${a.map(t=>`<div class="task ${t.done?"done":""} ${!t.done&&t.due&&t.due<today?"overdue":""} ${ui.taskSel===t.id?"sel":""}" data-id="${t.id}" id="task-${t.id}">
      <input type="checkbox" data-f="done" ${t.done?"checked":""} aria-label="완료">
      <button class="pinbtn ${num[t.id]?"has":""} ${ui.placingTask===t.id?"placing":""}" data-place title="${num[t.id]?(t.floor==="4F"?"4층":"3층")+" 위치 · 다시 누르면 위치 변경":"도면에 위치 표시"}">${num[t.id]?(t.floor==="4F"?"4F":"3F")+" #"+num[t.id]:"위치"}</button>
      <input type="text" class="t-title" data-f="title" value="${esc(t.title)}">
      <input type="date" class="t-due" data-f="due" value="${esc(t.due||"")}" aria-label="마감일">
      <input type="text" class="t-owner" data-f="owner" value="${esc(t.owner||"")}" placeholder="담당">
      <button class="x" data-del aria-label="삭제">${ui.confirmDel===t.id?"삭제?":"×"}</button>
      <textarea class="t-sol" data-f="solution" rows="1" placeholder="어떻게 해결했는지 적어 주세요">${esc(t.solution||"")}</textarea></div>`).join("")}`).join("") : `<div class="empty">${ui.taskFilter==="done"?"아직 끝낸 일이 없어요.":"남은 할 일이 없어요."}</div>`)
    : loadingOrEmpty("tasks","아직 등록한 할 일이 없어요. 아래에서 추가해 보세요.");
  return `${map}<div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0">할 일</h3>
    <div class="seg" role="group" aria-label="보기">${[["open","남은 일"],["all","전체"],["done","완료"]].map(([k,n])=>`<button data-tf="${k}" aria-pressed="${ui.taskFilter===k}">${n}</button>`).join("")}</div></div>
    ${list}
    <form class="addform" id="addTask"><label class="f">할 일<input id="nt-title" required placeholder="예: 무전기 대여 업체 견적"></label>
      <label class="f">분류<select id="nt-cat">${TASK_CATS.map(c=>`<option>${c}</option>`).join("")}</select></label>
      <label class="f">마감일<input id="nt-due" type="date"></label>
      <label class="f">담당<input id="nt-owner"></label>
      <button class="btn primary" type="submit">추가</button></form></div>`;
}
function bindTasks(){
  bindMapCard(id=>{
    if(id.startsWith("ctx-")) return;
    ui.taskSel=id; const t=state.tasks.find(x=>x.id===id);
    if(t&&t.done&&ui.taskFilter==="open") ui.taskFilter="all";
    render(); const el=document.getElementById("task-"+id); if(el) el.scrollIntoView({block:"center"});
  },(x,y)=>{
    if(!ui.placingTask) return; const t=state.tasks.find(z=>z.id===ui.placingTask); ui.placingTask=null;
    if(t){ui.taskSel=t.id; save("tasks",{...t,floor:ui.floor,x,y}); toast("위치를 표시했어요");}
  });
  const cp=$("#cancelPlace"); if(cp) cp.onclick=()=>{ui.placingTask=null;render();};
  document.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>{ui.taskFilter=b.dataset.tf;render();});
  document.querySelectorAll(".task[data-id]").forEach(row=>{
    const t=()=>state.tasks.find(x=>x.id===row.dataset.id);
    row.querySelectorAll("[data-f]").forEach(el=>el.onchange=()=>save("tasks",{...t(),[el.dataset.f]:el.type==="checkbox"?el.checked:el.value.trim()}));
    row.querySelector("[data-del]").onclick=()=>{ if(ui.confirmDel===t().id){ui.confirmDel=null;remove("tasks",t().id);} else {ui.confirmDel=t().id;render();} };
    row.querySelector("[data-place]").onclick=()=>{ const cur=t();
      if(ui.placingTask===cur.id){ui.placingTask=null;render();return;}
      if(cur.floor&&cur.floor!==ui.floor) ui.floor=cur.floor;
      ui.placingTask=cur.id; ui.taskSel=cur.id; ui.mapOpen=true; render();
      const mc=document.querySelector(".mapcard"); if(mc) mc.scrollIntoView({block:"start"}); };
  });
  $("#addTask").onsubmit=e=>{e.preventDefault(); const n=$("#nt-title").value.trim(); if(!n) return;
    save("tasks",{id:uid("t"),title:n,cat:$("#nt-cat").value,due:$("#nt-due").value,owner:$("#nt-owner").value.trim(),done:false}); toast("추가했어요");};
}
</script>
